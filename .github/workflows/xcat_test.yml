name: xcat_test
on: [pull_request, workflow_dispatch]
jobs:
  xcat_pr_test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Refresh package indexes
        run: sudo apt-get update
      - name: Install dependencies
        run: sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --no-install-suggests bats bubblewrap cpio gawk mawk rpm rsyslog build-essential fakeroot reprepro devscripts debhelper libcapture-tiny-perl libfile-slurper-perl libjson-perl libyaml-pp-perl libparallel-forkmanager-perl libsoap-lite-perl libdbi-perl libdbd-sqlite3-perl libcgi-pm-perl quilt openssh-server dpkg looptools genometools software-properties-common grub-common grub-efi-amd64-bin squashfs-tools pigz
      - name: Enable postscript test namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install lifecycle test dependencies
        run: sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --no-install-suggests ucf debconf-utils systemd libxml-simple-perl apache2 curl
      - name: Test Debian package lifecycle
        run: prove -v xCAT-test/native/xcatd_debian_lifecycle.t xCAT-test/native/xcatd_restart_callers.t xCAT-test/native/apache_package_lifecycle.t xCAT-test/native/package_upgrade_logging.t

      - name: Install image test dependencies
        if: ${{ !cancelled() }}
        run: sudo apt-get install -y --no-install-recommends cpio gzip libdbd-sqlite3-perl libxml-simple-perl libnet-dns-perl
      - name: Exercise image driver selection
        if: ${{ !cancelled() }}
        run: prove xCAT-test/native/genimage_network_drivers.t
      - name: Prepare xCAT syslog directory
        if: ${{ !cancelled() }}
        run: sudo install -d -o syslog -g adm -m 0750 /var/log/xcat
      - name: Run Ubuntu image fixture tests
        if: ${{ !cancelled() }}
        run: >-
          prove xCAT-test/native/ubuntu_live_media_guardrails.t
          xCAT-test/native/ubuntu_genimage_debootstrap_arch.t
          xCAT-test/native/ubuntu_genimage_apt_mirror.t
          xCAT-test/native/ubuntu_genimage_resolver_libs.t
      - name: Run tests
        if: ${{ !cancelled() }}
        run: perl github_action_xcat_test.pl
  rpm_lifecycle_test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: almalinux:8
            repository: powertools
          - image: almalinux:10
            repository: crb
    container:
      image: ${{ matrix.image }}
      options: --privileged --init
    steps:
      - uses: actions/checkout@v6
      - name: Install lifecycle test dependencies
        run: |
          dnf install -y epel-release
          dnf --enablerepo=${{ matrix.repository }} install -y perl perl-Capture-Tiny perl-File-Slurper perl-Test-Simple rpm-build bubblewrap systemd chkconfig initscripts tar gzip which diffutils httpd curl procps-ng
      - name: Enable lifecycle test namespaces
        run: sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test RPM package lifecycle
        run: su -s /bin/sh nobody -c 'prove -v xCAT-test/native/xcatd_rpm_lifecycle.t xCAT-test/native/apache_rpm_configuration.t xCAT-test/native/apache_package_lifecycle.t xCAT-test/native/package_upgrade_logging.t'
