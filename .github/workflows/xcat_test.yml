name: xcat_test
on: [pull_request, workflow_dispatch]
jobs:
  xcat_pr_test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Refresh package indexes
        run: sudo apt-get update
      - name: Install dependencies
        run: sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --no-install-suggests bats bubblewrap rpm rsyslog build-essential fakeroot reprepro devscripts debhelper libcapture-tiny-perl libfile-slurper-perl libjson-perl libyaml-pp-perl libparallel-forkmanager-perl libsoap-lite-perl libdbi-perl libcgi-pm-perl quilt openssh-server dpkg looptools genometools software-properties-common grub-common grub-efi-amd64-bin
      - name: Enable postscript test namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Prepare xCAT syslog directory
        run: sudo install -d -o syslog -g adm -m 0750 /var/log/xcat
      - name: Run tests
        run: perl github_action_xcat_test.pl
      # Ubuntu ships no mock, so the mock result directory test runs as root on Fedora.
      - name: Run mock result directory test
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/src:ro" -w /src fedora:42 bash -ec '
            dnf -y -q install mock perl perl-File-Slurper >/dev/null
            prove -v xCAT-test/native/mock_resultdir_owner.t' 2>&1 | tee mock.tap
          if grep -iE '# skip' mock.tap; then
            echo 'a mock result directory test was skipped' >&2
            exit 1
          fi
