# Stage one versus stage two of a chained network boot.
#
# Firmware PXE sends no user class (option 77) and should be handed a loader
# binary. The loader firmware just ran announces a user class and the features
# it has in option 175. With the features the script needs, it should be handed
# something else -- a script URL -- or it chainloads itself forever.
#
# RFC 3004 length-prefixes each user class string and plenty of clients send the
# bare string instead, so both encodings are exercised.
#
# No step here sends a MAC the server knows, so the script is the per-network
# one. The per-node script is in netboot-methods.conf.
#
# Scenario names carry the review number of the spec scenario they assert.
#
#   blackboxtest run -i eth1 --set user_class=iPXE \
#       --set stage1_loader=xcat/ipxe/i386/undionly.kpxe \
#       --set stage2_loader=http://10.0.0.1/tftpboot/xcat/ipxe/nets/10.0.0.0_24 \
#       --set stage1_uefi_loader=xcat/ipxe/x86_64-sb/snponly-shim.efi \
#       --set bios_features=130101180101210101 \
#       --set uefi_features=130101240101 \
#       conf/dhcp/ipxe-userclass.conf

[defaults]
client_arch     = 0x0000
vendor_class    = PXEClient:Arch:00000:UNDI:002001
request_options = 1, 3, 6, 43, 54, 60, 67, 175
expect          = offer

[scenario boot-stage-one]
description = S-21: A client with no user class is offered the first stage loader

[step stage1-discover]
type = discover
assert =
    msgtype == OFFER
    bootfile == %(stage1_loader)s

[scenario boot-stage-two-raw]
description = S-22, S-24: A user class sent as a bare string is handed the network script

[step stage2-raw-discover]
type            = discover
user_class      = %(user_class)s
user_class_form = raw
ipxe_options    = %(bios_features)s
assert =
    msgtype == OFFER
    bootfile == %(stage2_loader)s

[scenario boot-stage-two-rfc3004]
description = S-24: The same user class, length-prefixed per RFC 3004, is recognised

[step stage2-rfc-discover]
type            = discover
user_class      = %(user_class)s
user_class_form = rfc3004
ipxe_options    = %(bios_features)s
assert =
    msgtype == OFFER
    bootfile == %(stage2_loader)s

[scenario boot-stage-two-without-features]
description = A second stage without the features of the network script is handed the loader again

[step stage2-nofeatures-discover]
type            = discover
user_class      = %(user_class)s
user_class_form = raw
assert =
    msgtype == OFFER
    bootfile == %(stage1_loader)s

[scenario boot-stage-one-uefi]
description = S-21: A UEFI client with no user class is offered the UEFI loader binary

[step stage1-uefi-discover]
type         = discover
vendor_class = PXEClient:Arch:00007:UNDI:003016
client_arch  = 0x0007
assert =
    msgtype  == OFFER
    bootfile == %(stage1_uefi_loader)s

[scenario boot-stage-two-uefi]
description = S-23: A UEFI second stage is handed the same script with .uefi appended

# The UEFI build of the loader runs a different script from the BIOS build.
# A server that keys the second stage on the user class alone hands a UEFI
# machine the BIOS script, which it cannot execute.
[step stage2-uefi-discover]
type            = discover
vendor_class    = PXEClient:Arch:00007:UNDI:003016
client_arch     = 0x0007
user_class      = %(user_class)s
user_class_form = raw
ipxe_options    = %(uefi_features)s
assert =
    msgtype  == OFFER
    bootfile == %(stage2_loader)s.uefi
