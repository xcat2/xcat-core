# A Windows UEFI install that is left to the proxyDHCP daemon.
#
# xCAT defers such a node to proxydhcp-xcat, which answers on port 4011. The
# firmware only asks there when the offer carries option 60 = PXEClient and no
# boot file. An offer that names a loader boots that loader instead.
#
# The UEFI loader is still supplied so the failure output can name what was
# wrongly sent:
#
#   blackboxtest run -i eth1 \
#       --set proxy_mac=02:00:dc:11:00:63 \
#       --set proxy_ip=10.99.0.83 \
#       --set uefi_loader=xcat/xnba.efi \
#       conf/dhcp/proxydhcp.conf

[defaults]
request_options = 1, 3, 6, 43, 54, 60, 66, 67
timeout         = 3
retries         = 3
expect          = offer

[scenario proxydhcp-uefi-is-sent-no-loader]
description = A Windows UEFI install deferred to proxyDHCP is offered PXEClient and no boot file

[step uefi-discover]
type         = discover
mac          = %(proxy_mac)s
client_arch  = 0x0007
vendor_class = PXEClient:Arch:00007:UNDI:003016
assert =
    msgtype   == OFFER
    yiaddr    == %(proxy_ip)s
    option:60 == PXEClient
    bootfile  != %(uefi_loader)s
    bootfile  absent
    67        absent
