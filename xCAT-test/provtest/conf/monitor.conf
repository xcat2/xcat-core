# Stage 13: the install monitor on TCP 3002.  Spec P-64 to P-66, P-68, P-69.
#
# The installed system reports its progress here with `updateflag.awk`, over a
# plain socket with no TLS and no certificate of any kind.  The only thing that
# decides whose report it is, is the reverse lookup of the peer address: xcatd
# resolves it, strips the domain, and looks the result up in the node list
# (xcatd:428-470).  A peer it cannot name has its connection closed with no
# greeting at all, which is what makes the greeting itself an assertable thing.
#
#   provtest run \
#       --set server=10.99.1.1 --set client=10.99.1.11 \
#       --set unknown=10.99.1.201 --set monitorport=3002 --set xcatport=3001 \
#       conf/monitor.conf

[defaults]
server  = %(server)s
port    = %(monitorport)s
bind    = %(client)s
timeout = 20
retries = 2

# --- P-64, P-65 -------------------------------------------------------------

[scenario monitor-accepts-status]
description = A known node is greeted and its status report is acknowledged

[step report]
type = monitor
send =
    installstatus installing
assert =
    # P-64: the greeting arrives before anything is sent.
    greeting == ready
    # P-65: and each line is acknowledged.  xcatd answers `done` before it
    # acts, so this says the line was read, not that the state changed --
    # which is a database assertion and belongs to the unit suite.
    lines.0  == done

# --- P-66 -------------------------------------------------------------------

[scenario monitor-unknown-client]
description = A client that maps to no node is not greeted at all

[step unknownreport]
type   = monitor
bind   = %(unknown)s
send =
    installstatus installing
expect = fail
# The connection is accepted and then closed in silence.  From the node's side
# this is indistinguishable from a server that is up and ignoring it, which is
# exactly why a missing PTR is such an expensive mistake -- see P-74.
assert =
    greeting absent
    closed   == yes

# --- P-68 -------------------------------------------------------------------

[scenario monitor-unknown-verb]
description = A verb the service does not implement does not hang the client

[step nonsense]
type = monitor
send =
    thisisnotaverb
# The service answers `done` to anything and then falls through its chain of
# verbs without matching one.  What must not happen is the connection being
# held open until the client's own timeout: xcatd's alarm(2) closes it.
timeout = 10
assert =
    greeting == ready
    lines.0  == done
    closed   == yes

# --- P-69 -------------------------------------------------------------------

[scenario monitor-is-not-tls]
description = A TLS client hello gets no handshake on the monitor port

[step handshake]
type    = xcatreq
port    = %(monitorport)s
command = lsxcatd
expect  = fail
# Sent as an xcatreq deliberately: that step type opens TLS, and this port does
# not speak it.  Worth asserting rather than assuming, because it is the reason
# every scenario above can be sent in the clear -- and the reason nothing on
# this port may be trusted with anything a certificate would protect.
assert =
    handshake == no
