# Stage 1: DNS.  spec.md P-08.
#
# Run this only *after* the node has been removed and makedns re-run.  It is a
# separate file rather than a scenario in dns.conf because the two make
# opposite assertions about the same names, and a suite that ran both against
# one state would always fail one of them.
#
#   provtest run \
#       --set server=10.99.1.1 --set client=10.99.1.11 \
#       --set node=provtestcn --set domain=provtest.cluster \
#       --set revname=11.1.99.10.in-addr.arpa \
#       conf/dns-removal.conf

[defaults]
server  = %(server)s
bind    = %(client)s
timeout = 5

[scenario removed-node]
description = A withdrawn node resolves in neither direction

[step forward]
type   = dns
name   = %(node)s.%(domain)s
rrtype = A
assert =
    status == NXDOMAIN
    count  == 0

[step reverse]
type   = dns
name   = %(revname)s
rrtype = PTR
# A PTR left behind by a removal is the worse half of the two: the name is
# gone, so nothing resolves the node forward, but the address still claims to
# be it, and xcatd will act on that claim.
assert =
    status == NXDOMAIN
    count  == 0
