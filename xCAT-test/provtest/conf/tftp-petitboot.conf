# Stage 3: TFTP, petitboot.  spec.md P-23.
#
# POWER firmware fetches a config named by the uppercase hex of its own
# address, from the tftp root rather than from a subdirectory.  xCAT writes
# petitboot/<node> and hardlinks the hex name to it, so the two names are one
# file and must stay one file -- a copy that drifts is a node that boots what it
# was set to three nodesets ago.
#
#   provtest run \
#       --set server=10.99.1.1 --set client=10.99.1.11 \
#       --set node=provtestcn --set hexip=0A63010B \
#       --set master=10.99.1.1 --set xcatport=3001 --set destiny=install \
#       conf/tftp-petitboot.conf

[defaults]
server  = %(server)s
bind    = %(client)s
timeout = 8
retries = 2

[scenario petitboot-config]
description = The petitboot config answers under the node name and under the hex IP

[step byname]
type = tftp
path = petitboot/%(node)s
assert =
    size > 0
    text contains xcatd=%(master)s:%(xcatport)s
    text contains destiny=%(destiny)s

[step byhex]
type = tftp
path = %(hexip)s
assert =
    size   > 0
    sha256 == $byname.sha256
