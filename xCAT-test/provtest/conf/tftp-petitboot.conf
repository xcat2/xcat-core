# Stage 3: TFTP, petitboot.  Spec P-23.
#
# POWER firmware fetches a config named by the uppercase hex of its own
# address, from the tftp root rather than from a subdirectory.  xCAT writes
# petitboot/<node> and hardlinks the hex name to it, so the two names are one
# file and must stay one file -- a copy that drifts is a node that boots what it
# was set to three nodesets ago.
#
#   provtest run \
#       --set server=10.99.1.1 --set client=10.99.1.11 \
#       --set node=provtestcn --set hexip=0A63010B \
#       --set master=10.99.1.1 --set xcatport=3001 --set destiny=install \
#       conf/tftp-petitboot.conf

[defaults]
server  = %(server)s
bind    = %(client)s
timeout = 8
retries = 2

[scenario petitboot-config]
description = The petitboot config answers under the node name and under the hex IP

[step byname]
type = tftp
path = petitboot/%(node)s
assert =
    size > 0
    # The state nodeset was told to write, on the first line, as for the other
    # loader families.  xcatd= and destiny= are not asserted here: they are
    # written on the kernel command line only for the genesis states, and an OS
    # install is booted with the distribution installer's command line.
    text starts-with #%(destiny)s
    # petitboot reads one kernel line and one initrd line; without them the
    # firmware shows an empty boot menu and waits, which from a console looks
    # exactly like a node that never got a config at all.
    text contains kernel
    text contains initrd

[step byhex]
type = tftp
path = %(hexip)s
assert =
    size   > 0
    sha256 == $byname.sha256
