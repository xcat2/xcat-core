# Stage 9/10: getdestiny and nextdestiny over TLS 3001.  Spec P-49 to P-56.
#
# This is the request a genesis image makes to find out what it is for.  The
# genesis script pipes three lines of XML into `openssl s_client` with no client
# certificate and reads the answer back with sed; provtest does the same over a
# socket, from a chosen source address, because the source address is the
# identity: xcatd names the client by the reverse lookup of the address the
# connection arrived from.
#
# So `known` and `unknown` below differ in exactly one thing -- which address
# the request left by -- and that is the whole authentication model on the wire.
#
#   provtest run \
#       --set server=10.99.1.1 --set client=10.99.1.11 \
#       --set unknown=10.99.1.201 --set node=provtestcn \
#       --set destiny=install --set master=10.99.1.1 --set xcatport=3001 \
#       conf/xcatd-destiny.conf

[defaults]
server        = %(server)s
port          = %(xcatport)s
bind          = %(client)s
callback_port = 300
timeout       = 20
retries       = 2

# --- P-49 -------------------------------------------------------------------

[scenario certless-handshake]
description = A client with no certificate can open the TLS port

[step hello]
type    = xcatreq
command = lsxcatd
element =
    arg = -v
# If this ever stops holding, every scenario below it is untestable and no
# genesis image boots anywhere.  It is asserted first for that reason.
assert =
    handshake  == yes
    serverdone == yes

# --- P-50 -------------------------------------------------------------------

[scenario unknown-client]
description = A client whose address maps to no node is told to discover itself

[step unknown]
type    = xcatreq
command = getdestiny
bind    = %(unknown)s
assert =
    destiny == discover

# --- P-51, P-52, P-53, P-54, P-55 -------------------------------------------

[scenario known-node]
description = A known node is told its state, and everything it needs to reach it

[step known]
type    = xcatreq
command = getdestiny
assert =
    # P-51
    destiny   == %(destiny)s
    # P-52: an install destiny that names no kernel is a node that boots
    # nothing and reports success.
    kernel    present
    initrd    present
    # P-53
    kcmdline  contains xcatd=%(master)s:%(xcatport)s
    kcmdline  contains destiny=%(destiny)s
    # P-55: destiny.pm:975-987 tries noderes.tftpserver, then
    # noderes.xcatmaster, then the network's tftpserver, then site.master.
    # Four sources, no error if the wrong one wins -- the node boots and then
    # fetches from an address that does not answer.
    imgserver == %(master)s

[step imgserver]
type    = xcatreq
command = lsxcatd
# P-54: the address in the answer is asked a question of its own.  Asserting
# that the field holds the expected string proves the field; connecting to it
# proves the node can get there from where it is.
server  = $known.imgserver
element =
    arg = -v
assert =
    handshake == yes

# --- P-56 -------------------------------------------------------------------

[scenario chain-advances]
description = nextdestiny moves the node on to the next state in its chain

[step first]
type    = xcatreq
command = getdestiny
assert =
    destiny present

[step advance]
type    = xcatreq
command = nextdestiny
assert =
    serverdone == yes

[step second]
type    = xcatreq
command = getdestiny
# The database effect belongs to the unit suite; what is observable here is
# that two identical requests either side of a nextdestiny do not answer the
# same.  A chain that does not advance is a node that reinstalls forever.
assert =
    destiny !=  $first.destiny
