# Stage 4: HTTP.  Spec P-32 to P-39, and P-35/P-36 for the cross-stage half.
#
# Two Apache aliases carry the whole of a provision: /install for the repository
# and the autoinst file, /tftpboot for the kernel and initrd that grub2-http and
# xnba fetch over HTTP rather than TFTP.  Both trees are also served by another
# daemon over another protocol, which is where the interesting failure lives --
# the node is told a name over TFTP and fetches it over HTTP.
#
#   provtest run \
#       --set server=10.99.1.1 --set client=10.99.1.11 \
#       --set node=provtestcn --set httpport=80 --set otherport=8080 \
#       --set hexip=0A63010B --set knownfile=boot/grub2/grub.cfg-0A63010B \
#       --set installpath=autoinst/provtestcn --set repofile=repodata/repomd.xml \
#       conf/http.conf

[defaults]
server  = %(server)s
bind    = %(client)s
port    = %(httpport)s
timeout = 10
retries = 2

# --- P-32, P-34 -------------------------------------------------------------

[scenario install-tree]
description = The install tree is served on the configured port

[step autoinst]
type = http
path = /install/%(installpath)s
assert =
    status == 200
    size   > 0

# --- P-33 -------------------------------------------------------------------

[scenario tftp-tree-over-http]
description = The tftp tree is served over HTTP, byte for byte

[step overtftp]
type    = tftp
path    = %(knownfile)s
port    = 69
assert =
    size > 0

[step overhttp]
type = http
path = /tftpboot/%(knownfile)s
# One tree, two daemons.  grub2-http is told a file name by a TFTP fetch and
# then fetches it over HTTP; a divergence here is a node booting a different
# kernel from the one it was told about, and neither daemon logs anything odd.
assert =
    status == 200
    sha256 == $overtftp.sha256

# --- P-35, P-36 -------------------------------------------------------------

[scenario urls-the-node-was-given]
description = The autoinst and repository URLs in the kernel command line are served

[step urlconfig]
type = tftp
path = %(knownfile)s
port = 69
assert =
    size > 0

[step autoinsturl]
type    = extract
from    = $urlconfig.text
# anaconda writes inst.ks=, debian writes url=/preseed/url=; one pattern for
# the three because what is under test is the URL, not which installer it is
# addressed to.
pattern = (?:inst\.ks|\bks|preseed/url|\burl)=(https?://\S+)
assert =
    matched == yes

[step autoinsturlfetch]
type = http
url  = $autoinsturl.value
# Not the same assertion as the install-tree scenario above.  That one says the
# file is where this document says it is; this one says the node was told where
# it is.  Only the second failure stops an install.
assert =
    status == 200
    size   > 0

[step repourl]
type    = extract
from    = $urlconfig.text
pattern = (?:inst\.repo|method|mirror/http/hostname)=(https?://\S+)
assert =
    matched == yes

[step repo]
type = http
url  = $repourl.value/%(repofile)s
assert =
    status == 200

# --- P-37 -------------------------------------------------------------------

[scenario outside-the-aliases]
description = A path under neither alias is not served

[step outside]
type   = http
path   = /etc/xcat/cfgloc
expect = any
# `expect = any`: a 404 is a transport that worked perfectly and returned the
# right answer, so the assertion is on the status, not on the fetch.
assert =
    status != 200

# --- P-38 -------------------------------------------------------------------

[scenario postscripts-listing]
description = The postscripts directory is listable

[step listing]
type = http
path = /install/postscripts/
# xcatdsklspost fetches postscripts by name, but an operator debugging a failed
# one needs to see what is there; xcat.conf turns Indexes on for this tree
# deliberately.
assert =
    status == 200
    size   > 0

# --- P-39 -------------------------------------------------------------------

[scenario port-the-node-was-told]
description = The port named in the node's boot config is the port that answers

[step portconfig]
type = tftp
path = %(knownfile)s
port = 69
assert =
    size > 0

[step configport]
type    = extract
from    = $portconfig.text
pattern = set root=http,[^:\s]+:(\d+)
# site.httpport is read by four plugins that each build their own URL from it.
# Extracting the port the node was actually given, rather than asserting the
# one this file was told, is what makes this a test of xCAT and not of --set.
assert =
    matched == yes

[step served]
type = http
url  = http://%(server)s:$configport.value/tftpboot/%(knownfile)s
assert =
    status == 200

[step wrongport]
type   = http
url    = http://%(server)s:%(otherport)s/tftpboot/%(knownfile)s
expect = fail
# The control: if every port answered, the step above would prove nothing.
assert =
    status == 0

# --- P-39, the other half of it ---------------------------------------------

[scenario default-port-the-node-was-told]
description = A cluster on the default port names no port, and the default one answers

[step defaultconfig]
type = tftp
path = %(knownfile)s
port = 69
assert =
    size > 0

[step configroot]
type    = extract
from    = $defaultconfig.text
pattern = set root=http,(\S+)
# On site.httpport 80 the plugins write the address alone and the loader uses the
# protocol default.  A port here would be a node told to fetch from a port
# nothing was configured for, so the assertion is that there is no colon.
assert =
    matched == yes
    value   matches ^[^:]+$

[step defaultserved]
type = http
url  = http://$configroot.value/tftpboot/%(knownfile)s
assert =
    status == 200
