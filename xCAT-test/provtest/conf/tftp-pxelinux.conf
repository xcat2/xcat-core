# Stage 3: TFTP, pxelinux.  Spec P-18, P-19, P-20.
#
# pxelinux looks its config up under a series of names and takes the first that
# answers: the MAC form, then progressively shorter hex-IP prefixes, then
# `default`.  xCAT writes the node-named file and links the hex-IP name to it,
# so both must answer and both must answer the same thing.
#
# A separate file from tftp-grub2.conf, not a branch inside it: a node has one
# netboot method, and running both sets against one node would always fail one.
#
#   provtest run \
#       --set server=10.99.1.1 --set client=10.99.1.11 \
#       --set node=provtestcn --set hexip=0A63010B \
#       --set master=10.99.1.1 --set xcatport=3001 --set destiny=install \
#       --set bootnode=provtestbn \
#       conf/tftp-pxelinux.conf

[defaults]
server  = %(server)s
bind    = %(client)s
timeout = 8
retries = 2

# --- P-18, P-19 -------------------------------------------------------------

[scenario pxelinux-node-config]
description = The pxelinux config answers under the node name and under the hex IP

[step byname]
type = tftp
path = pxelinux.cfg/%(node)s
assert =
    size > 0
    text contains DEFAULT
    text contains xcatd=%(master)s:%(xcatport)s
    text contains destiny=%(destiny)s

[step byhex]
type = tftp
path = pxelinux.cfg/%(hexip)s
# The hex-IP name is the one the firmware actually asks for; the node name is
# the one an operator reads.  They are the same file, and a link that was not
# made is a node that falls through to `default` and discovers itself instead
# of installing.
assert =
    size   > 0
    sha256 == $byname.sha256

# --- P-20 -------------------------------------------------------------------

[scenario pxelinux-boot-from-disk]
description = A node set to boot is told to use its disk and is given no kernel

[step config]
type = tftp
path = pxelinux.cfg/%(bootnode)s
assert =
    size > 0
    text contains LOCALBOOT

[step kernelline]
type    = extract
from    = $config.text
pattern = ^\s*KERNEL\s+\S
# The DHCP half of this is dhcptest S-31: an installed node must stop being
# handed a boot file at all.  This half says that if a config is served anyway,
# it does not netboot.  Written as an extract that must find nothing, because
# "contains" has no negative form and an absent line is not an absent field.
assert =
    matched == no
