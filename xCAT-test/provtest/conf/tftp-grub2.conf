# Stage 3: TFTP, grub2.  Spec P-09, P-11 to P-15, P-17, P-24, P-70, P-71.
#
# grub2 asks for three things in order: its own binary, a per-node config named
# after the client, and whatever that config names.  Each fetch is by exact name,
# and a hex encoding wrong by one digit produces no error anywhere -- just a node
# sitting at the loader until someone reboots it.
#
# The cross-stage steps are the point: the config is fetched, the kernel path is
# read out of it, and *that* path is fetched.  Nothing here says what the kernel
# will be called, which is what stops it asserting xCAT against xCAT.
#
#   provtest run \
#       --set server=10.99.1.1 --set client=10.99.1.11 \
#       --set node=provtestcn --set hexip=0A63010B \
#       --set macdashes=52-54-00-dc-11-01 --set mac=52:54:00:dc:11:01 \
#       --set loader=boot/grub2/grub2.x86_64 \
#       --set master=10.99.1.1 --set xcatport=3001 --set destiny=install \
#       --set bootfile=boot/grub2/grub2-provtestcn \
#       conf/tftp-grub2.conf

[defaults]
server  = %(server)s
bind    = %(client)s
timeout = 8
retries = 2

# --- P-09 -------------------------------------------------------------------

[scenario grub2-binary]
description = The architecture's grub2 binary is present and not empty

[step loader]
type = tftp
path = %(loader)s
assert =
    # Not merely "the fetch succeeded": tftp-hpa creates the local file before
    # it knows whether the server will answer, so a zero-length result is what
    # a missing file looks like.  Size is the assertion that means something.
    size  > 0
    error absent

# --- P-11, P-15, P-16, P-17 -------------------------------------------------

[scenario grub2-node-config]
description = The per-node config is fetchable by hex-IP name and names the node's boot

[step config]
type = tftp
path = boot/grub2/grub.cfg-%(hexip)s
assert =
    size > 0
    # P-17: the state nodeset was told to put the node in.  xCAT writes it on
    # the first line, which is where nodestat reads it back from -- so a config
    # disagreeing with the database is a node whose reported state is not the
    # one it will boot.
    text starts-with #%(destiny)s
    # P-15: the installer picks its interface from BOOTIF, and a node with two
    # ports handed the wrong one installs onto the wrong network.  grub2 writes
    # $net_default_mac rather than the MAC xCAT has on file; either is correct
    # and an absent BOOTIF is not.
    text matches BOOTIF=(\$net_default_mac|01-%(macdashes)s)
    # P-16 is not asserted here: xcatd= and destiny= appear on the kernel command
    # line only for the genesis states, and an OS install is booted with the
    # distribution installer's.  The genesis form is asserted where a node is put
    # into one -- see the ordering and discovery scenarios.

# --- P-12 -------------------------------------------------------------------

[scenario grub2-config-by-mac]
description = The MAC-named config is the same file as the hex-IP one

[step byhex]
type = tftp
path = boot/grub2/grub.cfg-%(hexip)s
assert =
    size > 0

[step bymac]
type = tftp
path = boot/grub2/grub.cfg-01-%(macdashes)s
# grub2 tries the MAC form first and the hex-IP form second.  Two names for one
# file: a node whose MAC changed must not be served a stale config under the
# other name.
assert =
    size   > 0
    sha256 == $byhex.sha256

# --- P-13, P-14, P-71 -------------------------------------------------------

[scenario grub2-kernel-and-initrd]
description = The kernel and initrd the config names are themselves fetchable

[step kconfig]
type = tftp
path = boot/grub2/grub.cfg-%(hexip)s
assert =
    size > 0

[step kernelpath]
type    = extract
from    = $kconfig.text
# The path as grub2 wrote it, with the tftp root's prefix removed if it is
# there: the same file is reachable as /tftpboot/x over HTTP and as x over
# TFTP, and which form the config uses depends on whether root= is http.
pattern = ^\s*linux(?:efi|16)?\s+/?(?:tftpboot/)?(\S+)
assert =
    matched == yes

[step kernel]
type = tftp
path = $kernelpath.value
# P-71: if this is where the run goes red, the failure is at the kernel fetch
# and not at the config fetch, and the log says which file was missing.
assert =
    size  > 0
    error absent

[step initrdpath]
type    = extract
from    = $kconfig.text
pattern = ^\s*initrd(?:efi|16)?\s+/?(?:tftpboot/)?(\S+)
assert =
    matched == yes

[step initrd]
type = tftp
path = $initrdpath.value
assert =
    size > 0

# --- P-24 -------------------------------------------------------------------

[scenario tftp-escape]
description = A path climbing out of the tftp root is refused

[step escape]
type   = tftp
path   = ../../../../etc/passwd
expect = fail
# in.tftpd refuses this; the assertion is that it stays refused.  A server that
# served it would be handing the contents of the management node to anything
# that can reach port 69, which on a provisioning network is everything.
assert =
    size == 0

# --- P-70 -------------------------------------------------------------------

[scenario dhcp-named-file-must-exist]
description = The boot file DHCP names is fetchable under exactly that name

[step named]
type = tftp
# Spelled by the caller, because nothing here speaks DHCP: this is the name a
# grub2 node's offer carries, and the pair of suites divides the claim -- dhcptest
# asserts that xCAT sends this name, and this asserts that the name sent can be
# fetched.  Neither one alone is enough to boot a node.
path = %(bootfile)s
assert =
    size  > 0
    error absent
