# Stage 5: the genesis / discovery artefacts.  Spec P-25 to P-31.
#
# A machine nobody has defined has no node name to look a file up by, so
# everything here is keyed on the *network* it booted on.  That makes these files
# the ones that are wrong the longest: a cluster whose nodes are all defined
# never fetches them, and the day someone racks a new machine nothing works and
# nothing says why.
#
# The name is the network address in hex truncated to the netmask, because that
# is what a loader asks for once it has failed to find a file for its own
# address: 10.99.1.0/24 is 0A6301, six digits and not eight.
#
# Three loader families, and a cluster runs whichever its architecture reaches:
# pxelinux and xnba for x86_64, grub2 for the UEFI architectures.  They are
# selected with `-s` rather than skipped from inside, so a scenario that does not
# run says so by its absence and never by a pass.
#
#   provtest run \
#       --set server=10.99.1.1 --set client=10.99.1.11 \
#       --set hexnet=0A6301 --set netfile=10.99.1.0_24 \
#       --set master=10.99.1.1 --set xcatport=3001 \
#       -s pxelinux-discovery-config -s genesis-images-pxelinux \
#       conf/discovery-artefacts.conf

[defaults]
server  = %(server)s
bind    = %(client)s
timeout = 10
retries = 2

# --- P-25, P-26, P-27, P-28 -------------------------------------------------

[scenario grub2-discovery-config]
description = The per-network grub2 discovery config exists and asks for discovery

[step config]
type = tftp
path = boot/grub2/grub.cfg-%(hexnet)s
assert =
    size > 0
    # P-28: where to ask for the next destiny.
    text contains xcatd=%(master)s:%(xcatport)s

[step httpentry]
type    = extract
from    = $config.text
pattern = set root=(http)
# P-26, first half: the fast path.  Loading a 60 MB initrd over TFTP takes
# minutes per machine, which is why the HTTP entry exists and why it is first.
assert =
    matched == yes

[step fallback]
type    = extract
from    = $config.text
pattern = set fallback=(\d+)
# P-26, second half: and the reason the slow path is still written.  A machine
# whose firmware has no HTTP stack must still discover itself, so the entry
# order and the fallback index are load-bearing, not decoration.
assert =
    matched == yes
    value   == 1

# --- P-29 -------------------------------------------------------------------

[scenario pxelinux-discovery-config]
description = The pxelinux discovery config answers under the hex network address

[step pxeconfig]
type = tftp
path = pxelinux.cfg/%(hexnet)s
# No `destiny=discover` here, deliberately: genesis asks xcatd what to do when
# the kernel command line does not say, and an undefined machine is answered
# `discover`.  The address it asks is the whole content of this file, and a wrong
# one strands the machine in genesis with no error anywhere.
assert =
    size > 0
    text contains xcatd=%(master)s:%(xcatport)s
    text contains genesis.kernel

# --- P-29, the other x86_64 loader ------------------------------------------

[scenario xnba-discovery-config]
description = The xnba discovery scripts for the network exist and name xcatd

[step gpxe]
type = tftp
path = xcat/xnba/nets/%(netfile)s
assert =
    size > 0
    text contains xcatd=%(master)s:%(xcatport)s

[step uefi]
type = tftp
path = xcat/xnba/nets/%(netfile)s.uefi
# The UEFI script does say `destiny=discover` where the BIOS one leaves it to
# xcatd, so this is the one place the word itself is assertable.
assert =
    size > 0
    text contains destiny=discover
    text contains xcatd=%(master)s:%(xcatport)s

# --- P-30, P-31 -------------------------------------------------------------

[scenario genesis-images-pxelinux]
description = The genesis kernel and initrd named by the pxelinux config are fetchable

[step pconfig]
type = tftp
path = pxelinux.cfg/%(hexnet)s
assert =
    size > 0

[step pkernelpath]
type    = extract
from    = $pconfig.text
pattern = ^\s*KERNEL\s+/?(\S+)
assert =
    matched == yes

[step pkernel]
type = tftp
path = $pkernelpath.value
assert =
    size > 0

[step pinitrdpath]
type    = extract
from    = $pconfig.text
pattern = \binitrd=(\S+)
assert =
    matched == yes

[step pinitrd]
type    = tftp
path    = $pinitrdpath.value
# Tens of megabytes over TFTP, slow enough to need its own timeout.  Fetched
# rather than merely looked for: a half-written initrd from an interrupted mknb
# is exactly the failure this catches, and a file that exists is not the same as
# a file that transfers.
timeout = 120
retries = 1
assert =
    size > 0

[scenario genesis-images-grub2]
description = The genesis kernel and initrd named by the grub2 config are fetchable

[step gconfig]
type = tftp
path = boot/grub2/grub.cfg-%(hexnet)s
assert =
    size > 0

[step kernelpath]
type    = extract
from    = $gconfig.text
pattern = ^\s*linux(?:efi|16)?\s+/?(?:tftpboot/)?(\S+)
assert =
    matched == yes

[step kernel]
type = tftp
path = $kernelpath.value
assert =
    size > 0

[step initrdpath]
type    = extract
from    = $gconfig.text
pattern = ^\s*initrd(?:efi|16)?\s+/?(?:tftpboot/)?(\S+)
assert =
    matched == yes

[step initrd]
type    = tftp
path    = $initrdpath.value
timeout = 120
retries = 1
assert =
    size > 0
