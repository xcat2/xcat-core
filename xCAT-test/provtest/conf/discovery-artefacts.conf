# Stage 5: the genesis / discovery artefacts.  spec.md P-25 to P-31.
#
# A machine nobody has defined has no node name to look a file up by, so
# everything here is keyed on the *network* it booted on -- the only thing the
# server knows about it before discovery has happened.  That makes these files
# the ones that are wrong the longest: a cluster whose nodes are all defined
# never fetches them, and the day someone racks a new machine, nothing works and
# nothing says why.
#
#   provtest run \
#       --set server=10.99.1.1 --set client=10.99.1.11 \
#       --set hexnet=0A630100 --set net=10.99.1.0 \
#       --set master=10.99.1.1 --set xcatport=3001 \
#       conf/discovery-artefacts.conf

[defaults]
server  = %(server)s
bind    = %(client)s
timeout = 10
retries = 2

# --- P-25, P-26, P-27, P-28 -------------------------------------------------

[scenario grub2-discovery-config]
description = The per-network grub2 discovery config exists and asks for discovery

[step config]
type = tftp
path = boot/grub2/grub.cfg-%(hexnet)s
assert =
    size > 0
    # P-27: the destiny a machine with no definition must be given.
    text contains destiny=discover
    # P-28: and where to ask for the next one.
    text contains xcatd=%(master)s:%(xcatport)s

[step httpentry]
type    = extract
from    = $config.text
pattern = set root=(http)
# P-26, first half: the fast path.  Loading a 60 MB initrd over TFTP takes
# minutes per machine, which is why the HTTP entry exists and why it is first.
assert =
    matched == yes

[step fallback]
type    = extract
from    = $config.text
pattern = set fallback=(\d+)
# P-26, second half: and the reason the slow path is still written.  A machine
# whose firmware has no HTTP stack must still discover itself, so the entry
# order and the fallback index are load-bearing, not decoration.
assert =
    matched == yes
    value   == 1

# --- P-29 -------------------------------------------------------------------

[scenario pxelinux-discovery-config]
description = The pxelinux discovery config answers under the hex network address

[step pxeconfig]
type = tftp
path = pxelinux.cfg/%(hexnet)s
assert =
    size > 0
    text contains destiny=discover

# --- P-30, P-31 -------------------------------------------------------------

[scenario genesis-kernel-and-initrd]
description = The genesis kernel and initrd named by the discovery config are fetchable

[step gconfig]
type = tftp
path = boot/grub2/grub.cfg-%(hexnet)s
assert =
    size > 0

[step kernelpath]
type    = extract
from    = $gconfig.text
pattern = ^\s*linux(?:efi|16)?\s+/?(?:tftpboot/)?(\S+)
assert =
    matched == yes

[step kernel]
type = tftp
path = $kernelpath.value
assert =
    size > 0

[step initrdpath]
type    = extract
from    = $gconfig.text
pattern = ^\s*initrd(?:efi|16)?\s+/?(?:tftpboot/)?(\S+)
assert =
    matched == yes

[step initrd]
type    = tftp
path    = $initrdpath.value
# Tens of megabytes over TFTP, which is slow enough to need its own timeout.
# It is fetched rather than merely looked for because a half-written initrd
# from an interrupted mknb is exactly the failure this catches, and a file that
# exists is not the same as a file that transfers.
timeout = 120
retries = 1
assert =
    size > 0
