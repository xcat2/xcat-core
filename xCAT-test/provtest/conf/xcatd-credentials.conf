# Stage 11: getcredentials.  Spec P-61, P-62, P-63.
#
# This is the one request a forged client cannot simply ask for.  Before xcatd
# signs anything it connects back to the client on TCP 300 and sends
# `CREDOKBYYOU?`; it signs only if the client answers `CREDOKBYME`
# (credentials.pm:611, callback port checked at credentials.pm:130-136).
#
# That callback is the only thing standing between "an address with a PTR" and
# "a signed cluster certificate", so both halves are asserted: that it is made,
# and that a client which cannot answer it gets nothing.
#
#   provtest run \
#       --set server=10.99.1.1 --set client=10.99.1.11 \
#       --set xcatport=3001 --set credtype=xcat \
#       conf/xcatd-credentials.conf

[defaults]
server        = %(server)s
port          = %(xcatport)s
bind          = %(client)s
callback_port = 300
timeout       = 30
retries       = 1

# --- P-62, P-63 -------------------------------------------------------------

[scenario credentials-granted]
description = A client that answers the callback is given a signed certificate

[step getcredentials]
type            = xcatreq
command         = getcredentials
element =
    credentials = %(credtype)s
# The listener goes up on the client's port 300 before the request is sent,
# because the server connects back while the request is still open: a listener
# started afterwards would be started too late.
callback_listen = 300
callback_reply  = CREDOKBYME
callback_wait   = 20
assert =
    # P-63: the callback arrived, and on the port the request named.
    callback_seen == yes
    callback_data contains CREDOKBYYOU
    # P-62: and the answer carries something signed.
    data          present
    error         absent

# --- P-61 -------------------------------------------------------------------

[scenario credentials-refused]
description = A client with no listener on the callback port is given nothing

[step norefused]
type    = xcatreq
command = getcredentials
element =
    credentials = %(credtype)s
# No callback_listen: the port is closed, the server's connection is refused,
# and the challenge goes unanswered.  Anything signed arriving here would mean
# an address alone is enough to collect a cluster certificate.
expect  = any
assert =
    callback_seen == no
    data          absent
