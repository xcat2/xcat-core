# Failing at exactly one place.  Spec P-72, P-74, P-75.
#
# Every scenario in this file arranges for each stage before the interesting
# one to be correct, so the run goes red at one identifiable point.  That is the
# whole argument for a wire suite: today all of these failures look the same
# from the outside -- the node times out -- and telling them apart means
# watching a console during a reboot.
#
# P-74 needs the node's PTR removed first, and P-75 needs a second nodeset, so
# the fixture drives them in that order and the scenarios are selected with -s
# rather than all run at once.
#
#   provtest run \
#       --set server=10.99.1.1 --set client=10.99.1.11 \
#       --set node=provtestcn --set hexip=0A63010B \
#       --set xcatport=3001 --set unreachable=10.99.1.250 \
#       --set destiny=install --set second=boot \
#       conf/ordering.conf

[defaults]
server  = %(server)s
bind    = %(client)s
timeout = 15
retries = 1

# --- P-72 -------------------------------------------------------------------

[scenario unreachable-master]
description = A master that does not answer is distinguishable from one that refuses

[step reachable]
type    = xcatreq
port    = %(xcatport)s
command = lsxcatd
element =
    arg = -v
assert =
    handshake == yes

[step unreachable]
type    = xcatreq
server  = %(unreachable)s
port    = %(xcatport)s
command = lsxcatd
expect  = fail
# The two steps differ in one thing: the address.  A node whose kernel command
# line names an address nothing answers on boots perfectly and then stops, and
# from the console that looks identical to a protocol fault at a server that
# is up.  Here the two are told apart without booting anything.
assert =
    handshake == no
    error     present

# --- P-74 -------------------------------------------------------------------
# Run this only after the node's PTR has been removed.

[scenario missing-ptr]
description = A node whose reverse record is gone is treated as an unknown client

[step getdestiny]
type    = xcatreq
port    = %(xcatport)s
command = getdestiny
# Nothing about the node changed: it is still defined, still set to install,
# still on the same address.  One DNS record decides whether xcatd recognises
# it, and its absence is reported nowhere -- the node is simply told to
# discover itself, forever.
assert =
    destiny == discover
    destiny != %(destiny)s

# --- P-75 -------------------------------------------------------------------
# Run this only after a second nodeset has set the node to another state.

[scenario state-replaced]
description = A second nodeset leaves no trace of the first state

[step config]
type = tftp
path = boot/grub2/grub.cfg-%(hexip)s
assert =
    size > 0
    text contains destiny=%(second)s

[step stale]
type    = extract
from    = $config.text
pattern = destiny=%(destiny)s
# The previous state's artefacts are the ones nobody looks for.  A config
# rewritten in place is fine; a config left behind under another of its names
# is a node that boots last week's decision.
assert =
    matched == no
