# Stage 7: findme.  spec.md P-42 to P-46, P-48, P-73.
#
# Read the gates before reading the scenarios, because they are not where they
# look.  xcatd's UDP listener sends `processing` back to the client's TCP 3001
# as soon as a datagram arrives that begins with the gzip magic or with `<xcat`
# (xcatd:861-876).  The source-port and managed-network checks happen later, in
# the discovery worker (xcatd:708-711), and what they gate is the plugin
# dispatch -- so an ignored findme still produces the first callback and never
# produces a second.  That asymmetry is the whole reason these scenarios assert
# on the number of callbacks rather than on their presence.
#
# Nothing here signs the packet.  Nothing in xcatd checks a signature.
#
#   provtest run \
#       --set server=10.99.1.1 --set client=10.99.1.11 \
#       --set foreign=10.98.1.11 \
#       conf/findme.conf

[defaults]
server  = %(server)s
bind    = %(client)s
timeout = 10
retries = 1

# --- P-44, P-45, P-46, P-73 -------------------------------------------------

[scenario findme-callbacks]
description = A well-formed findme is acknowledged and then resolved

[step discover]
type            = findme
source_port     = 301
encoding        = gzip
callback_listen = 3001
# zzzdiscovery runs last and exists to say "nobody claimed this".  The second
# callback can take as long as the slowest discovery plugin, which is the ARP
# table lookup in seqdiscovery.
callback_wait   = 20
assert =
    # P-44, P-45
    count       >= 1
    callbacks.0 == processing
    # P-46, P-73: the failure callback is what lets a node tell "not yet" from
    # "never".  Without it, dodiscovery retries for 180 seconds and the console
    # says nothing either way.
    count       == 2
    callbacks.1 == processed

# --- P-48 -------------------------------------------------------------------

[scenario findme-plain-xml]
description = The uncompressed encoding is accepted as well as the gzipped one

[step plain]
type            = findme
encoding        = plain
source_port     = 301
callback_listen = 3001
callback_wait   = 20
# xcatd tests for the RFC 1952 magic and then for a `<xcat` prefix.  Anything
# matching neither falls through to the flow-control branch and is discarded in
# silence, so an encoding that stopped being recognised would look exactly like
# a network that dropped the packet.
assert =
    count       >= 1
    callbacks.0 == processing

# --- P-42 -------------------------------------------------------------------

[scenario findme-unprivileged-port]
description = A findme from an unprivileged port is acknowledged and then dropped

[step unprivileged]
type            = findme
source_port     = 32768
encoding        = gzip
callback_listen = 3001
callback_wait   = 20
assert =
    # The acknowledgement is sent before the port is looked at, so it arrives.
    count       == 1
    callbacks.0 == processing
    # And nothing follows it.  The node is told its request is being handled
    # and then never hears again: this scenario pins that behaviour so a change
    # to it is visible, not because it is a good one.

# --- P-43 -------------------------------------------------------------------

[scenario findme-foreign-address]
description = A findme from an address on no managed network is not dispatched

[step foreign]
type            = findme
bind            = %(foreign)s
source_port     = 301
encoding        = gzip
callback_listen = 3001
callback_wait   = 20
# "xcatd: Skipping discovery from <ip> because ... the client address does not
# match an IP network that xCAT is managing" -- xcatd:721.  The acknowledgement
# still goes out, to the foreign address, which is why the listener is bound
# there too.
assert =
    count == 1
