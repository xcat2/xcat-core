# Stage 3/4: TFTP then HTTP, xnba.  Spec P-21, P-22.
#
# xnba is the one netboot method that crosses transports on its own: the gpxe
# script arrives over TFTP and then fetches the kernel over HTTP.  So a script
# that is correct and a web server that is not produce a node that gets all the
# way to `imgfetch` and stops.  Both halves are asserted here, in that order.
#
# They are two scenarios rather than one because they fail for unrelated
# reasons, and a management node can be in a state where the second cannot be
# asserted at all -- a web server answering the cluster's port that is not the
# one xCAT configured serves nothing xCAT named, and every path fetched from it
# is a 404 that says nothing about the script that named it.  Splitting them
# lets the script half still be asserted there.  The second scenario fetches
# the script again, because a scenario that depends on another having been
# selected is a scenario that cannot be run on its own.
#
#   provtest run \
#       --set server=10.99.1.1 --set client=10.99.1.11 \
#       --set node=provtestcn --set httpport=80 \
#       conf/tftp-xnba.conf

[defaults]
server  = %(server)s
bind    = %(client)s
timeout = 8
retries = 2

# --- P-21 -------------------------------------------------------------------

[scenario xnba-script]
description = The node's gpxe script is served and is a gpxe script

[step script]
type = tftp
path = xcat/xnba/nodes/%(node)s
assert =
    size          > 0
    # gpxe refuses a script without this first line, and refuses it silently.
    text starts-with #!gpxe
    text contains imgfetch

# --- P-22 -------------------------------------------------------------------

[scenario xnba-kernel]
description = The gpxe script fetches its kernel over HTTP from the next-server

# Named apart from the step above only because step names are file-wide.
[step gpxe]
type = tftp
path = xcat/xnba/nodes/%(node)s
assert =
    text contains imgfetch

[step kernelurl]
type    = extract
from    = $gpxe.text
pattern = imgfetch\s+(?:-n\s+\S+\s+)?https?://[^/\s]+(/\S+)
# The host is deliberately not asserted, because xnba deliberately does not
# write one: the script says ${next-server}, the variable gpxe fills in from
# the DHCP acknowledgement, so the node fetches from whoever booted it -- its
# service node in a hierarchical cluster, and not necessarily the management
# node.  Which address arrives in that acknowledgement is dhcptest's subject.
# What is assertable here is the path, and that it is served.
assert =
    matched == yes

[step kernel]
type = http
path = $kernelurl.value
port = %(httpport)s
# The assertion that matters: the path the node was told to fetch answers.
# Not a path this file built out of the same parts, which would only prove
# that two copies of the same assumption agree.
assert =
    status == 200
    size   > 0
