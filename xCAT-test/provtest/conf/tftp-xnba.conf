# Stage 3/4: TFTP then HTTP, xnba.  Spec P-21, P-22.
#
# xnba is the one netboot method that crosses transports on its own: the gpxe
# script arrives over TFTP and then fetches the kernel over HTTP.  So a script
# that is correct and a web server that is not produce a node that gets all the
# way to `imgfetch` and stops.  Both halves are asserted here, in that order.
#
#   provtest run \
#       --set server=10.99.1.1 --set client=10.99.1.11 \
#       --set node=provtestcn --set nextserver=10.99.1.1 \
#       conf/tftp-xnba.conf

[defaults]
server  = %(server)s
bind    = %(client)s
timeout = 8
retries = 2

# --- P-21, P-22 -------------------------------------------------------------

[scenario xnba-script]
description = The gpxe script fetches its kernel over HTTP from the next-server

[step script]
type = tftp
path = xcat/xnba/nodes/%(node)s
assert =
    size          > 0
    # gpxe refuses a script without this first line, and refuses it silently.
    text starts-with #!gpxe
    text contains imgfetch

[step kernelurl]
type    = extract
from    = $script.text
pattern = imgfetch\s+(?:-n\s+\S+\s+)?(\S+)
assert =
    matched == yes
    # The host in the URL is the address DHCP handed out as next-server.  xnba
    # builds it from the node's own attributes, so a node in a hierarchical
    # cluster that is pointed at the management node instead of its service
    # node fetches across a link that may not carry it.
    value starts-with http://%(nextserver)s

[step kernel]
type = http
url  = $kernelurl.value
# The assertion that matters: the URL the node was told to use answers.  Not a
# URL this file built out of the same parts, which would only prove that two
# copies of the same assumption agree.
assert =
    status == 200
    size   > 0
