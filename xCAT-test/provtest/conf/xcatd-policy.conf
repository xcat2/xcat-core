# Stage 9: what a certless client may and may not ask for.  Spec P-59, P-60.
#
# The default policy grants a certless client exactly the commands a booting
# node needs: getdestiny, nextdestiny, getpostscript, getcredentials, lsxcatd,
# syncfiles, litefile, litetree, getadapter, getbmcconfig, remoteimmsetup.  That
# list is what makes this whole suite possible, and it is also the boundary --
# anything outside it must be refused to a client that has shown no
# certificate, or a machine on the provisioning network owns the cluster.
#
#   provtest run \
#       --set server=10.99.1.1 --set client=10.99.1.11 \
#       --set xcatport=3001 --set refused=rpower --set node=provtestcn \
#       conf/xcatd-policy.conf

[defaults]
server  = %(server)s
port    = %(xcatport)s
bind    = %(client)s
timeout = 20
retries = 1

# --- P-59 -------------------------------------------------------------------

[scenario command-outside-policy]
description = A command with no policy row is refused to a certless client

[step refused]
type    = xcatreq
command = %(refused)s
element =
    noderange = %(node)s
    arg       = stat
expect  = any
# A refusal is the passing result, so the transport expectation is waived and
# the assertion is on what came back.  What must not come back is a result.
assert =
    handshake  == yes
    error      present
    serverdone == yes

# --- P-60 -------------------------------------------------------------------

[scenario malformed-request]
description = Garbage on the wire does not take the listener down

[step garbage]
type    = xcatreq
command = getdestiny
# `raw` replaces the whole request body, so this is not XML at all.  A forked
# child dying on it is fine; the parent accepting no further connections is
# not, and the difference is only visible from a second client.
raw     = this is not xml, and it is not meant to be
expect  = any

[step afterwards]
type    = xcatreq
command = getdestiny
assert =
    handshake == yes
    destiny   present
