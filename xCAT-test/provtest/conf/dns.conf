# Stage 1: DNS.  Spec P-01 through P-08.
#
# Everything a node does after DHCP is done by name, and xcatd decides which
# node it is talking to by resolving the client's address backwards.  So the
# forward record is what the node needs and the reverse record is what the
# server needs, and a cluster missing either one fails in a way that reports
# nothing.
#
# Every expected value is supplied with --set.  This file states that a record
# exists and holds a given value; it states nothing about how named was
# configured, or by what.
#
#   provtest run \
#       --set server=10.99.1.1 --set client=10.99.1.11 \
#       --set node=provtestcn --set domain=provtest.cluster \
#       --set nodeip=10.99.1.11 --set revname=11.1.99.10.in-addr.arpa \
#       --set alias=provtestcn-eth0 --set master=10.99.1.1 \
#       --set missing=nosuchnode --set forwarded=example.com \
#       --set net=10.99.1.0/24 \
#       conf/dns.conf

[defaults]
server  = %(server)s
bind    = %(client)s
timeout = 5
retries = 2

# --- P-01 -------------------------------------------------------------------

[scenario node-forward]
description = The node's own name resolves to the address it was defined with

[step a]
type   = dns
name   = %(node)s.%(domain)s
rrtype = A
assert =
    status == NOERROR
    count  >= 1
    type   == A
    data   == %(nodeip)s

# --- P-02, P-03 -------------------------------------------------------------

[scenario node-reverse]
description = The node's address resolves to its fully qualified name

[step ptr]
type   = dns
name   = %(revname)s
rrtype = PTR
assert =
    status == NOERROR
    count  >= 1
    type   == PTR
    data   == %(node)s.%(domain)s
    # P-03: the same record read as an identity.  xcatd strips the domain and
    # the -eth/-ib/-myri suffix from this and looks the rest up in the node
    # list, so a PTR naming anything else costs the node its identity.  P-74
    # asserts the consequence at the xcatd end.
    data   starts-with %(node)s.

# --- P-04 -------------------------------------------------------------------

[scenario node-alias]
description = A configured alias is a CNAME to the node

[step cname]
type   = dns
name   = %(alias)s.%(domain)s
rrtype = A
assert =
    status == NOERROR
    # dig follows the CNAME, so both records come back in one answer section.
    type   == CNAME
    data   == %(node)s.%(domain)s
    data   == %(nodeip)s

# --- P-05 -------------------------------------------------------------------

[scenario forwarded-name]
description = A name in no local zone is answered from a forwarder

[step outside]
type      = dns
name      = %(forwarded)s
rrtype    = A
recursion = yes
timeout   = 10
assert =
    status == NOERROR
    count  >= 1

# --- P-06 -------------------------------------------------------------------

[scenario local-nxdomain]
description = An undefined name in the cluster domain is refused, not forwarded

[step undefined]
type   = dns
name   = %(missing)s.%(domain)s
rrtype = A
expect = any
# `expect = any`: NXDOMAIN *is* the answer under test.  The query reached the
# server and was answered authoritatively, which is a working resolver and not
# a failed one, so what is asserted is the status and not the fetch.
assert =
    status    == NXDOMAIN
    count     == 0
    # aa: the refusal came from the zone itself rather than from a forwarder
    # that happened not to know the name either.
    flags     contains aa
    authority >= 1

# --- P-07 -------------------------------------------------------------------

[scenario master-resolves]
description = The name the node is handed as its master resolves to the master

[step master]
type   = dns
name   = %(master)s
rrtype = A
assert =
    status == NOERROR
    count  >= 1
    # The node has one route.  A master resolving to the management node's
    # other address is a name that answers and an address that does not.
    data   in %(net)s
