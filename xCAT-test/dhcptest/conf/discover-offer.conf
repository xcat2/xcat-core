# A DISCOVER draws exactly one OFFER, from the server we expect.
#
#   dhcptest run -i eth1 --set net=10.0.0.0/24 --set server=10.0.0.1 \
#       conf/discover-offer.conf

[defaults]
timeout = 2
retries = 3

[scenario offer-basic]
description = A DISCOVER on this network draws exactly one OFFER

[step discover]
type            = discover
request_options = 1, 3, 6, 15, 28, 51, 54
expect          = offer
assert =
    msgtype   == OFFER
    offers    == 1
    yiaddr    in %(net)s
    option:54 == %(server)s
    option:51 present
    option:1  present
