# One DISCOVER per PXE client architecture (DHCP option 93), asserting on what
# the server hands back as the loader.
#
# `bootfile` is option 67 when the server sent one and the BOOTP `file` header
# otherwise, which is what firmware itself reads. Servers genuinely differ:
# ISC dhcpd fills the header, dnsmasq answers in option 67 once the client has
# asked for it. Assert on `file` directly only when the header itself is the
# point.
#
# Expected filenames are supplied on the command line so this file stays a
# statement about the wire, not about any particular server's configuration:
#
#   dhcptest run -i eth1 --set tftp=10.0.0.1 \
#       --set bios_loader=pxelinux.0 \
#       --set uefi_loader=xcat/xnba.efi \
#       --set aarch64_loader=boot/grub2/grub2.aarch64 \
#       --set riscv64_loader=boot/grub2/grub2.riscv64 \
#       conf/pxe-arch-matrix.conf
#
# Every scenario here is a machine nobody has defined: no MAC of ours is in the
# server's database, so what comes back has to come from the subnet. That is
# also the discovery case, which is the one that has to work for a machine to
# be defined at all.
#
# Scenario names carry the review number of the specification scenario they
# assert -- see xCAT-test/dhcptest/spec.md.

[defaults]
# 12, 51, 114 and 209 are in the request list because ISC dhcpd sends an option
# it was configured with only when the client asks for it. A client that does
# not ask sees an empty reply and reads it as a missing feature.
request_options = 1, 3, 6, 12, 43, 51, 54, 60, 66, 67, 97, 114, 128, 129, 130, 131, 132, 133, 134, 135, 209
expect          = offer

[scenario pxe-bios-x86]
description = S-11: A BIOS PXE client is offered a BIOS loader and a next-server

[step bios-discover]
type         = discover
vendor_class = PXEClient:Arch:00000:UNDI:002001
client_arch  = 0x0000
assert =
    msgtype == OFFER
    siaddr  == %(tftp)s
    bootfile == %(bios_loader)s

[scenario pxe-lease-is-short]
description = S-51: A PXE client's lease is 600 seconds, not the cluster default

# Firmware takes a pool address, boots, and never comes back for it. During a
# large discovery those addresses are the pool, so they have to be returned
# quickly rather than held for the cluster's default half a day. 600 is the
# number, not "shorter than the default": a lease time nobody wrote down is a
# lease time nobody can tell has regressed.
[step lease-time-discover]
type         = discover
vendor_class = PXEClient:Arch:00000:UNDI:002001
client_arch  = 0x0000
assert =
    msgtype   == OFFER
    option:51 == 600

[scenario pxe-uefi-x64]
description = S-11: An x86_64 UEFI client is offered a UEFI loader

[step uefi-discover]
type         = discover
vendor_class = PXEClient:Arch:00007:UNDI:003016
client_arch  = 0x0007
assert =
    msgtype == OFFER
    siaddr  == %(tftp)s
    bootfile == %(uefi_loader)s

[scenario pxe-uefi-x64-alternate-id]
description = S-11: The alternate x86-64 UEFI id gets the same loader as 0x0007

# 0x0009 is the same firmware as 0x0007 under a second identifier that plenty
# of machines announce instead. A server that knows only one of them hands
# ordinary UEFI hardware whatever its fallback is.
[step uefi-alt-discover]
type         = discover
vendor_class = PXEClient:Arch:00009:UNDI:003016
client_arch  = 0x0009
assert =
    msgtype == OFFER
    siaddr  == %(tftp)s
    bootfile == %(uefi_loader)s

[scenario pxe-aarch64]
description = S-11, S-57: An aarch64 UEFI client is offered the aarch64 loader

[step aarch64-discover]
type         = discover
vendor_class = PXEClient:Arch:00011:UNDI:003000
client_arch  = 0x000b
assert =
    msgtype == OFFER
    siaddr  == %(tftp)s
    bootfile == %(aarch64_loader)s

[scenario pxe-riscv64-tftp]
description = S-11: A RISC-V UEFI client booting over TFTP is offered the riscv64 loader

[step riscv64-discover]
type         = discover
vendor_class = PXEClient:Arch:00027:UNDI:003000
client_arch  = 0x001b
assert =
    msgtype == OFFER
    siaddr  == %(tftp)s
    bootfile == %(riscv64_loader)s

[scenario httpboot-riscv64]
description = S-13: A RISC-V HTTP-boot client is offered a URL and tagged HTTPClient

[step riscv64-http-discover]
type         = discover
vendor_class = HTTPClient:Arch:00028:UNDI:003000
client_arch  = 0x001c
assert =
    msgtype     == OFFER
    option:60   == HTTPClient
    bootfile    starts-with http://
    bootfile    contains %(riscv64_loader)s

[scenario pxe-ia64]
description = S-11: An ia64 client is offered elilo

[step ia64-discover]
type         = discover
vendor_class = PXEClient:Arch:00002:UNDI:002001
client_arch  = 0x0002
assert =
    msgtype == OFFER
    siaddr  == %(tftp)s
    bootfile == %(ia64_loader)s

[scenario pxe-ppc64]
description = S-11: A ppc64 UEFI client is offered the ppc grub2, not yaboot

# yaboot is an Open Firmware loader. A ppc64 machine in UEFI mode cannot run
# it, so falling through to it is not a lenient default -- it is a machine that
# does not boot.
[step ppc64-discover]
type         = discover
vendor_class = PXEClient:Arch:00012:UNDI:003000
client_arch  = 0x000c
assert =
    msgtype == OFFER
    siaddr  == %(tftp)s
    bootfile == %(ppc64_loader)s

[scenario httpboot-uefi-x64]
description = S-11: An x86-64 UEFI HTTP-boot client is recognised as UEFI x64

# 0x0010 is UEFI x86-64 over HTTP: the same firmware and the same loader as
# 0x0007, announced by a machine configured to fetch it over HTTP instead of
# TFTP. A server that does not know the id treats a mainstream client as
# unrecognisable.
[step uefi-http-discover]
type         = discover
vendor_class = HTTPClient:Arch:00016:UNDI:003000
client_arch  = 0x0010
assert =
    msgtype == OFFER
    siaddr  == %(tftp)s
    bootfile == %(uefi_loader)s

[scenario opal-v3-petitboot]
description = S-17: An OPAL-v3 POWER client is given a petitboot conf-file and no loader

[step opal-discover]
type         = discover
vendor_class = PXEClient:Arch:00014:UNDI:003000
client_arch  = 0x000e
assert =
    msgtype    == OFFER
    option:209 == %(opal_conf)s
    bootfile   absent

[scenario s390x-qemu]
description = S-16: A QEMU s390x client is given a conf-file and no loader

[step s390x-discover]
type        = discover
client_arch = 0x001f
assert =
    msgtype    == OFFER
    option:209 == %(s390x_conf)s
    bootfile   absent

[scenario vendor-class-etherboot]
description = S-18: A client that identifies itself by vendor class alone still boots

# Etherboot predates option 93. It says what it is in option 60 and nothing
# else, so the vendor class is the only thing the server can key on.
[step etherboot-discover]
type         = discover
vendor_class = Etherboot-5.4
assert =
    msgtype  == OFFER
    bootfile == %(bios_loader)s

[scenario vendor-class-onie]
description = S-19: An ONIE switch is offered an installer URL before it is a node

# A switch announces onie_vendor on its very first boot, which is necessarily
# before anyone has defined it as a node. If only a node definition can produce
# the installer URL, the switch can never reach the state where it gets one.
#
# Option 114 is asked for, because a server sends an option when the client
# asks for it: ISC dhcpd puts nothing in the reply for an option missing from
# the parameter request list, however carefully the class set it. A real ONIE
# switch asks for 114, which is the whole reason xCAT's dhcpd.conf redefines
# www-server to that code.
[step onie-discover]
type            = discover
vendor_class    = onie_vendor:x86_64
request_options = 1, 3, 6, 54, 114
assert =
    msgtype    == OFFER
    option:114 == %(onie_url)s

[scenario unrecognised-client]
description = S-20: A client that says nothing recognisable falls through to yaboot

# No option 93 and no vendor class the server knows. The reply still has to
# name something: a client left with an address and no boot file has no way to
# tell that it was served at all.
[step anonymous-discover]
type = discover
assert =
    msgtype  == OFFER
    bootfile == %(fallback_loader)s
