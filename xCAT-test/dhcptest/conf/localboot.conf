# A node that already has an operating system.
#
# Once a node has been installed, chain.currstate is "boot" (or "iscsiboot" for
# a node whose disk is an iSCSI target). From that point the server must stop
# handing it a netboot script: a node that is given one every time it powers on
# reinstalls itself forever, and does so silently, because each individual boot
# looks like a successful boot.
#
# The address is still owned by the node and must still be offered -- this is a
# statement about the boot file, not about the reservation.
#
# Two of the steps are the two halves of an xNBA boot. Firmware asks first with
# no user class; the loader it would be given asks again announcing user class
# xNBA, and *that* is the request the node's own script is keyed on. Both are
# sent because they are answered by different rules and a test that sends only
# the first cannot see the second break.
#
# What is asserted is spec S-31: no boot file at all, on either request.
# Allowing the stage-1 binary through would be a weaker statement that looks
# equivalent and is not -- a node handed the stage-1 loader comes back as an
# xNBA second stage and is answered with the *network's* script, so a server
# that withholds only the per-node script still reinstalls the machine. The
# script URL is still supplied on the command line, for the failure output to
# name what was wrongly sent, so this file stays a statement about the wire:
#
#   dhcptest run -i eth1 \
#       --set booted_mac=02:00:dc:11:00:61 \
#       --set booted_ip=10.0.0.61 \
#       --set booted_script=http://10.0.0.1/tftpboot/xcat/xnba/nodes/dhcptestboot \
#       --set booted_pxe_mac=02:00:dc:11:00:62 \
#       --set booted_pxe_ip=10.0.0.62 \
#       conf/localboot.conf

[defaults]
request_options = 1, 3, 6, 43, 54, 60, 66, 67
timeout         = 3
retries         = 3
expect          = offer

[scenario booted-node-is-not-sent-a-script]
description = S-31: A node that has been installed is offered its address and no xNBA script

[step firmware-discover]
type         = discover
mac          = %(booted_mac)s
client_arch  = 0x0000
vendor_class = PXEClient:Arch:00000:UNDI:002001
assert =
    msgtype  == OFFER
    yiaddr   == %(booted_ip)s
    bootfile != %(booted_script)s
    bootfile absent

[scenario booted-pxe-node-is-not-sent-a-loader]
description = S-31: An installed node provisioned with netboot=pxe is not handed pxelinux either

# A different node in the same state, provisioned the other way. netboot=pxe
# has a boot-from-disk rule of its own, written as its own branch, so the xNBA
# node above passing says nothing about this one. There is no second stage to
# ask for here: pxelinux is what the firmware itself would be given.
[step pxe-firmware-discover]
type         = discover
mac          = %(booted_pxe_mac)s
client_arch  = 0x0000
vendor_class = PXEClient:Arch:00000:UNDI:002001
assert =
    msgtype  == OFFER
    yiaddr   == %(booted_pxe_ip)s
    bootfile absent

[scenario booted-node-is-not-sent-a-script-on-the-second-stage]
description = S-31: And is not sent one when the loader asks again as xNBA

# The same node, same MAC, announcing the user class the first stage sets. This
# is the request the script is keyed on, so it is the one that decides whether
# an installed node reinstalls itself.
[step second-stage-discover]
type            = discover
mac             = %(booted_mac)s
client_arch     = 0x0000
vendor_class    = PXEClient:Arch:00000:UNDI:002001
user_class      = xNBA
user_class_form = raw
assert =
    msgtype  == OFFER
    yiaddr   == %(booted_ip)s
    bootfile != %(booted_script)s
    bootfile absent
