# A node that already has an operating system.
#
# Once a node has been installed, chain.currstate is "boot" (or "iscsiboot" for
# a node whose disk is an iSCSI target). From that point the server must stop
# handing it a netboot script: a node that is given one every time it powers on
# reinstalls itself forever, and does so silently, because each individual boot
# looks like a successful boot.
#
# The address is still owned by the node and must still be offered -- this is a
# statement about the boot file, not about the reservation.
#
# The two steps are the two halves of an xNBA boot. Firmware asks first with no
# user class and is answered with the loader binary; the loader then asks again
# announcing user class xNBA, and *that* is the request that would be answered
# with the node's script. A test that only sends the first request cannot see
# the difference, because the script never appears in the first reply.
#
# What is asserted is exactly spec.md S-31: not "no boot file", which would
# forbid a server from handing back the stage-1 binary, but "not the node's
# xNBA script". The script URL is supplied on the command line so this file
# stays a statement about the wire:
#
#   dhcptest run -i eth1 \
#       --set booted_mac=02:00:dc:11:00:61 \
#       --set booted_ip=10.0.0.61 \
#       --set booted_script=http://10.0.0.1/tftpboot/xcat/xnba/nodes/dhcptestboot \
#       conf/localboot.conf

[defaults]
request_options = 1, 3, 6, 43, 54, 60, 66, 67
timeout         = 3
retries         = 3
expect          = offer

[scenario booted-node-is-not-sent-a-script]
description = S-31: A node that has been installed is offered its address and no xNBA script

[step firmware-discover]
type         = discover
mac          = %(booted_mac)s
client_arch  = 0x0000
vendor_class = PXEClient:Arch:00000:UNDI:002001
assert =
    msgtype  == OFFER
    yiaddr   == %(booted_ip)s
    bootfile != %(booted_script)s

[scenario booted-node-is-not-sent-a-script-on-the-second-stage]
description = S-31: And is not sent one when the loader asks again as xNBA

# The same node, same MAC, announcing the user class the first stage sets. This
# is the request the script is keyed on, so it is the one that decides whether
# an installed node reinstalls itself.
[step second-stage-discover]
type            = discover
mac             = %(booted_mac)s
client_arch     = 0x0000
vendor_class    = PXEClient:Arch:00000:UNDI:002001
user_class      = xNBA
user_class_form = raw
assert =
    msgtype  == OFFER
    yiaddr   == %(booted_ip)s
    bootfile != %(booted_script)s
