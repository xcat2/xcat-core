# A node that already has an operating system.
#
# Once installed, chain.currstate is "boot" (or "iscsiboot"). From then on the
# server must stop handing it a netboot script: a node given one every power-on
# reinstalls itself forever, silently, because each boot looks successful.
#
# The address is still owned by the node and must still be offered -- this is
# about the boot file, not the reservation.
#
# Two of the steps are the halves of an xNBA boot: firmware asks with no user
# class, and the loader it would be given asks again announcing xNBA, which is
# what the node's own script is keyed on. Both are answered by different rules.
#
# What is asserted is spec S-31: no boot file at all, on either request. Letting
# the stage-1 binary through looks equivalent and is not -- the node comes back
# as an xNBA second stage and is answered with the *network's* script. The script
# URL is still supplied so the failure output can name what was wrongly sent:
#
#   dhcptest run -i eth1 \
#       --set booted_mac=02:00:dc:11:00:61 \
#       --set booted_ip=10.0.0.61 \
#       --set booted_script=http://10.0.0.1/tftpboot/xcat/xnba/nodes/dhcptestboot \
#       --set booted_pxe_mac=02:00:dc:11:00:62 \
#       --set booted_pxe_ip=10.0.0.62 \
#       conf/localboot.conf

[defaults]
request_options = 1, 3, 6, 43, 54, 60, 66, 67
timeout         = 3
retries         = 3
expect          = offer

[scenario booted-node-is-not-sent-a-script]
description = S-31: A node that has been installed is offered its address and no xNBA script

[step firmware-discover]
type         = discover
mac          = %(booted_mac)s
client_arch  = 0x0000
vendor_class = PXEClient:Arch:00000:UNDI:002001
assert =
    msgtype  == OFFER
    yiaddr   == %(booted_ip)s
    bootfile != %(booted_script)s
    bootfile absent

[scenario booted-pxe-node-is-not-sent-a-loader]
description = S-31: An installed node provisioned with netboot=pxe is not handed pxelinux either

# The same state on the other netboot method. netboot=pxe has a boot-from-disk
# rule of its own, so the xNBA node above passing says nothing about this one.
# There is no second stage to ask for: pxelinux is what firmware itself gets.
[step pxe-firmware-discover]
type         = discover
mac          = %(booted_pxe_mac)s
client_arch  = 0x0000
vendor_class = PXEClient:Arch:00000:UNDI:002001
assert =
    msgtype  == OFFER
    yiaddr   == %(booted_pxe_ip)s
    bootfile absent

[scenario booted-node-is-not-sent-a-script-on-the-second-stage]
description = S-31: And is not sent one when the loader asks again as xNBA

# The same node, same MAC, announcing the user class the first stage sets. This
# is the request the script is keyed on, so it is the one that decides whether
# an installed node reinstalls itself.
[step second-stage-discover]
type            = discover
mac             = %(booted_mac)s
client_arch     = 0x0000
vendor_class    = PXEClient:Arch:00000:UNDI:002001
user_class      = xNBA
user_class_form = raw
assert =
    msgtype  == OFFER
    yiaddr   == %(booted_ip)s
    bootfile != %(booted_script)s
    bootfile absent
