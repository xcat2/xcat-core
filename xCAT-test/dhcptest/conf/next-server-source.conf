# Where a node is told to fetch its boot file from.
#
# siaddr is the address the firmware opens a TFTP connection to, and it has
# three possible sources in falling order of precedence: the node's own
# tftpserver, its xcatmaster, and the subnet's tftpserver. In a flat cluster
# all three are the management node and any of them would appear to work; in a
# hierarchical one they are three different machines, and a node sent to the
# wrong one hangs at the firmware with no diagnostic.
#
# Three nodes are used rather than three attributes on one, so each answer is
# distinguishable from the others: if the addresses were the same, a server
# that ignored the node attribute entirely would pass every scenario here.
#
# Scenario names carry the review number of the specification scenario they
# assert -- see the DHCP wire spec.
#
#   dhcptest run -i eth1 \
#       --set tftp_mac=02:00:dc:11:00:31 --set tftp_ip=10.0.0.31 \
#       --set tftp_server=10.0.0.61 \
#       --set xcm_mac=02:00:dc:11:00:32 --set xcm_ip=10.0.0.32 \
#       --set xcm_server=10.0.0.62 \
#       --set sub_mac=02:00:dc:11:00:33 --set sub_ip=10.0.0.33 \
#       --set sub_server=10.0.0.1 \
#       conf/next-server-source.conf

[defaults]
client_arch     = 0x0000
vendor_class    = PXEClient:Arch:00000:UNDI:002001
request_options = 1, 3, 6, 54, 66, 67
expect          = offer
timeout         = 3
retries         = 3

[scenario next-server-from-the-node]
description = S-36: A node with its own tftpserver is sent to that machine

[step tftpserver-discover]
type = discover
mac  = %(tftp_mac)s
assert =
    msgtype == OFFER
    yiaddr  == %(tftp_ip)s
    siaddr  == %(tftp_server)s

[scenario next-server-falls-back-to-xcatmaster]
description = S-37: A node with no tftpserver is sent to its xcatmaster

# This node has an xcatmaster and no tftpserver, and the two addresses in this
# file are different machines, so an offer naming the tftpserver of the node
# above -- or the subnet's -- is a visible failure rather than a coincidence.
[step xcatmaster-discover]
type = discover
mac  = %(xcm_mac)s
assert =
    msgtype == OFFER
    yiaddr  == %(xcm_ip)s
    siaddr  == %(xcm_server)s

[scenario next-server-falls-back-to-the-subnet]
description = S-38: A node with neither is sent to the subnet's tftpserver

[step subnet-discover]
type = discover
mac  = %(sub_mac)s
assert =
    msgtype == OFFER
    yiaddr  == %(sub_ip)s
    siaddr  == %(sub_server)s
