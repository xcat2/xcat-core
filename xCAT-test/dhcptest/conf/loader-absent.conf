# What a client is told when the loader it would be given is not there.
#
# Naming a file the TFTP server does not have costs the client a timeout it
# cannot diagnose. Substituting a different loader is worse: it hides the missing
# file and boots something nobody asked for. The only safe answer is an address
# and no boot file.
#
# Run with the loader for the architecture under test removed from the TFTP
# directory and the configuration regenerated: both backends decide which boot
# classes to write by looking at what is on disk.
#
# Scenario names carry the review number of the spec scenario they assert.
#
#   dhcptest run -i eth1 --set pool=10.0.0.200-10.0.0.250 \
#       --set present_loader=xcat/xnba.efi \
#       conf/loader-absent.conf

[defaults]
request_options = 1, 3, 6, 54, 66, 67
expect          = offer
timeout         = 3
retries         = 3

[scenario missing-loader-is-not-named]
description = S-12: A client whose loader is absent is served, and handed nothing to fetch

[step absent-loader-discover]
type         = discover
vendor_class = PXEClient:Arch:00000:UNDI:002001
client_arch  = 0x0000
assert =
    msgtype  == OFFER
    yiaddr   in %(pool)s
    bootfile absent

[scenario present-loader-is-still-named]
description = S-12: An architecture whose loader is still there is unaffected

# Without this, a server that had stopped naming any boot file at all would
# pass the scenario above. The point is that the missing one is skipped, not
# that boot files stopped being handed out.
[step present-loader-discover]
type         = discover
vendor_class = PXEClient:Arch:00007:UNDI:003016
client_arch  = 0x0007
assert =
    msgtype  == OFFER
    bootfile == %(present_loader)s
