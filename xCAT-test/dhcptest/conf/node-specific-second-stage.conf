# A chainloaded second stage that is addressed to one particular machine.
#
# ipxe-userclass.conf establishes that a client announcing a user class is
# given something other than the first stage loader. This goes one step
# further: on a server that keeps a per-host policy, the thing it is given
# names the host, so two machines chainloading at the same moment do not both
# run the same script.
#
# The first stage is unaffected -- a machine with no user class still gets the
# ordinary loader -- which is asserted here too, because a server that hands
# the script out unconditionally would boot the loader into itself forever.
#
#   dhcptest run -i eth1 \
#       --set node_mac=52:54:00:aa:bb:01 \
#       --set node_ip=10.0.0.11 \
#       --set node_name=cn1 \
#       --set node_loader=xcat/xnba.kpxe \
#       --set user_class=xNBA \
#       --set stage2_prefix=/nodes/ \
#       conf/node-specific-second-stage.conf

[defaults]
client_arch     = 0x0000
vendor_class    = PXEClient:Arch:00000:UNDI:002001
request_options = 1, 3, 6, 43, 54, 60, 66, 67
expect          = offer
timeout         = 3

[scenario node-first-stage]
description = With no user class the known machine gets the ordinary loader

[step stage1-discover]
type = discover
mac  = %(node_mac)s
assert =
    msgtype  == OFFER
    yiaddr   == %(node_ip)s
    bootfile == %(node_loader)s

[scenario node-second-stage-names-the-node]
description = Announcing the user class gets that machine its own second stage

[step stage2-discover]
type            = discover
mac             = %(node_mac)s
user_class      = %(user_class)s
user_class_form = raw
assert =
    msgtype  == OFFER
    yiaddr   == %(node_ip)s
    bootfile != %(node_loader)s
    bootfile contains %(stage2_prefix)s%(node_name)s
