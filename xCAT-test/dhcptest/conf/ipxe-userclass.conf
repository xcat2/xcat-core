# Stage one versus stage two of a chained network boot.
#
# Firmware PXE sends no user class (option 77) and should be handed a loader
# binary. The loader that firmware just ran announces itself with a user class
# and should be handed something else -- typically a script URL -- otherwise it
# would chainload itself forever.
#
# RFC 3004 length-prefixes each user class string; plenty of clients send the
# bare string instead. Both encodings are exercised here because a server that
# only matches one of them will fail for real clients.
#
#   dhcptest run -i eth1 --set user_class=iPXE --set stage1_loader=undionly.kpxe \
#       conf/ipxe-userclass.conf

[defaults]
client_arch     = 0x0000
vendor_class    = PXEClient:Arch:00000:UNDI:002001
request_options = 1, 3, 6, 43, 54, 60, 67, 175
expect          = offer

[scenario boot-stage-one]
description = A client with no user class is offered the first stage loader

[step stage1-discover]
type = discover
assert =
    msgtype == OFFER
    bootfile == %(stage1_loader)s

[scenario boot-stage-two-raw]
description = A user class sent as a bare string is recognised

[step stage2-raw-discover]
type            = discover
user_class      = %(user_class)s
user_class_form = raw
assert =
    msgtype == OFFER
    bootfile != %(stage1_loader)s

[scenario boot-stage-two-rfc3004]
description = The same user class, length-prefixed per RFC 3004, is recognised

[step stage2-rfc-discover]
type            = discover
user_class      = %(user_class)s
user_class_form = rfc3004
assert =
    msgtype == OFFER
    bootfile != %(stage1_loader)s
