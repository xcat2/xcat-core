# Stage one versus stage two of a chained network boot.
#
# Firmware PXE sends no user class (option 77) and should be handed a loader
# binary. The loader that firmware just ran announces itself with a user class
# and should be handed something else -- typically a script URL -- otherwise it
# would chainload itself forever.
#
# RFC 3004 length-prefixes each user class string; plenty of clients send the
# bare string instead. Both encodings are exercised here because a server that
# only matches one of them will fail for real clients.
#
# None of these steps sends a MAC the server has been told about, so the script
# it is handed is the per-network one. The per-node script a defined machine
# gets is in netboot-methods.conf.
#
# Scenario names carry the review number of the specification scenario they
# assert -- see xCAT-test/dhcptest/spec.md.
#
#   dhcptest run -i eth1 --set user_class=xNBA \
#       --set stage1_loader=xcat/xnba.kpxe \
#       --set stage2_loader=http://10.0.0.1/tftpboot/xcat/xnba/nets/10.0.0.0_24 \
#       --set stage1_uefi_loader=xcat/xnba.efi \
#       conf/ipxe-userclass.conf

[defaults]
client_arch     = 0x0000
vendor_class    = PXEClient:Arch:00000:UNDI:002001
request_options = 1, 3, 6, 43, 54, 60, 67, 175
expect          = offer

[scenario boot-stage-one]
description = S-21: A client with no user class is offered the first stage loader

[step stage1-discover]
type = discover
assert =
    msgtype == OFFER
    bootfile == %(stage1_loader)s

[scenario boot-stage-two-raw]
description = S-22, S-24: A user class sent as a bare string is handed the network script

[step stage2-raw-discover]
type            = discover
user_class      = %(user_class)s
user_class_form = raw
assert =
    msgtype == OFFER
    bootfile == %(stage2_loader)s

[scenario boot-stage-two-rfc3004]
description = S-24: The same user class, length-prefixed per RFC 3004, is recognised

[step stage2-rfc-discover]
type            = discover
user_class      = %(user_class)s
user_class_form = rfc3004
assert =
    msgtype == OFFER
    bootfile == %(stage2_loader)s

[scenario boot-stage-one-uefi]
description = S-21: A UEFI client with no user class is offered the UEFI loader binary

[step stage1-uefi-discover]
type         = discover
vendor_class = PXEClient:Arch:00007:UNDI:003016
client_arch  = 0x0007
assert =
    msgtype  == OFFER
    bootfile == %(stage1_uefi_loader)s

[scenario boot-stage-two-uefi]
description = S-23: A UEFI second stage is handed the same script with .uefi appended

# The UEFI build of the loader runs a different script from the BIOS build.
# A server that keys the second stage on the user class alone hands a UEFI
# machine the BIOS script, which it cannot execute.
[step stage2-uefi-discover]
type            = discover
vendor_class    = PXEClient:Arch:00007:UNDI:003016
client_arch     = 0x0007
user_class      = %(user_class)s
user_class_form = raw
assert =
    msgtype  == OFFER
    bootfile == %(stage2_loader)s.uefi
