# A client that speaks BOOTP and not DHCP.
#
# The same BOOTP header sent with no option 53 at all, answered with a plain
# BOOTREPLY rather than an OFFER. The hardware this is for is old enough that it
# will not be replaced.
#
# A backend that answers only DHCP leaves such a machine timing out for ever with
# nothing on the wire to say why.
#
# Scenario names carry the review number of the spec scenario they assert.
#
#   dhcptest run -i eth1 --set bootp_mac=02:00:de:ad:b0:07 \
#       --set pool=10.0.0.200-10.0.0.250 conf/bootp-client.conf

[scenario bootp-client-is-served]
description = S-54: A BOOTP-only client is given an address out of the dynamic range

[step bootrequest]
type    = bootrequest
mac     = %(bootp_mac)s
expect  = bootreply
timeout = 4
retries = 3
assert =
    msgtype == BOOTREPLY
    yiaddr  in %(pool)s
