# Reserved address versus dynamic pool.
#
# "Reserved" means the server holds a host reservation for that MAC and must
# always answer it with that one address. "Unreserved" means it holds none.
#
# This file assumes the subnet has a dynamic pool, so an unreserved MAC is
# offered an address out of it. That is the provisioning case and the one xCAT
# builds: a machine nobody has defined has to be reachable long enough to be
# identified. A reservations-only subnet, where an unreserved MAC draws no
# reply at all, is a different network and this file does not describe it.
#
# Every address comes from the command line, so this file says nothing about
# how the server was configured or by what:
#
#   dhcptest run -i eth1 \
#       --set reserved_mac=52:54:00:aa:bb:cc \
#       --set reserved_ip=10.0.0.51 \
#       --set unreserved_mac=02:00:de:ad:be:ef \
#       --set pool=10.0.0.100/26 \
#       conf/static-vs-dynamic.conf

[scenario reserved-mac]
description = A reserved MAC is offered and acknowledged its reserved address

[step reserved-discover]
type            = discover
mac             = %(reserved_mac)s
request_options = 1, 3, 6, 51, 54
expect          = offer
assert =
    msgtype == OFFER
    yiaddr  == %(reserved_ip)s

[step reserved-request]
type              = request
mac               = %(reserved_mac)s
requested_address = $offer.address
server_id         = $offer.server_id
expect            = ack
assert =
    msgtype == ACK
    yiaddr  == %(reserved_ip)s

[scenario unreserved-mac-gets-pool-address]
description = An unreserved MAC is offered an address out of the dynamic pool

[step pool-discover]
type            = discover
mac             = %(unreserved_mac)s
request_options = 1, 3, 6, 51, 54
expect          = offer
assert =
    msgtype == OFFER
    yiaddr  in %(pool)s
    yiaddr  != %(reserved_ip)s

[step pool-request]
type              = request
mac               = %(unreserved_mac)s
requested_address = $offer.address
server_id         = $offer.server_id
expect            = ack
assert =
    msgtype == ACK
    yiaddr  == $offer.address
    yiaddr  in %(pool)s
