# A node that has been taken out of the cluster.
#
# `makedhcp -d` withdraws a node's reservation. The machine may still be powered
# on and discovering, so what matters is that it stops being offered the address
# it used to hold: that address now belongs to whoever gets it next, and a server
# still handing it out puts two machines on it.
#
# The two scenarios run separately, with `makedhcp -d` in between and without
# regenerating the configuration -- that would put the reservation straight back.
#
# Scenario names carry the review number of the spec scenario they assert.
#
#   dhcptest run -i eth1 -s removed-node-keeps-its-reservation-until-it-is-withdrawn \
#       --set removed_mac=02:00:dc:11:00:61 --set removed_ip=10.0.0.61 \
#       --set pool=10.0.0.200-10.0.0.250 conf/node-removal.conf

[defaults]
request_options = 1, 3, 6, 54, 67
timeout         = 3
retries         = 3

[scenario removed-node-keeps-its-reservation-until-it-is-withdrawn]
description = S-59: Before withdrawal the node is served the address it was defined with

[step still-defined-discover]
type   = discover
mac    = %(removed_mac)s
expect = offer
assert =
    msgtype == OFFER
    yiaddr  == %(removed_ip)s

[scenario withdrawn-node-is-no-longer-served-its-address]
description = S-59: Once the reservation is withdrawn that MAC is not offered the address again

# Still on the network and still asking, so still served -- out of the pool, like
# any machine with no reservation. What must not come back is the address it used
# to hold.
[step withdrawn-discover]
type    = discover
mac     = %(removed_mac)s
expect  = offer
assert =
    msgtype == OFFER
    yiaddr  != %(removed_ip)s
    yiaddr  in %(pool)s
