# What a machine the server has been told about is handed to boot.
#
# One defined node per netboot method. The method is an attribute of the node, so
# the answer has to come from what the operator wrote against it -- not from the
# client architecture, which is all a subnet-wide boot class can see. A server
# that answers a nimol node with the subnet's x86 loader does not install it.
#
# Scenario names carry the review number of the spec scenario they assert.
#
#   dhcptest run -i eth1 \
#       --set xnba_mac=02:00:dc:11:00:21 --set xnba_node=cn21 \
#       --set xnba_loader=xcat/xnba.kpxe \
#       ... conf/netboot-methods.conf

[defaults]
client_arch     = 0x0000
vendor_class    = PXEClient:Arch:00000:UNDI:002001
# Option 12 is asked for because a node has to learn its own name from the
# lease; 209 because a petitboot node is answered with a conf-file and nothing
# else. ISC sends neither unless the client asks.
request_options = 1, 3, 6, 12, 43, 54, 60, 66, 67, 209
expect          = offer
timeout         = 3
retries         = 3

[scenario netboot-xnba]
description = S-26, S-27: A node with netboot=xnba is handed the xNBA loader binary

# No user class: this is the firmware's own first request, so it gets the
# loader itself and not the second stage the next scenario asserts. Having a
# second-stage rule for this node must not change what its first stage sees.
[step xnba-discover]
type = discover
mac  = %(xnba_mac)s
assert =
    msgtype   == OFFER
    yiaddr    == %(xnba_ip)s
    bootfile  == %(xnba_loader)s

[scenario netboot-xnba-second-stage]
description = S-25: The same node announcing user class xNBA is handed its own script

# The loader the previous scenario handed out is what sends this request, and
# what comes back has to name this node: two machines chainloading at once must
# not run the same script. Both encodings of option 77 are exercised.
[step xnba-stage2-raw]
type            = discover
mac             = %(xnba_mac)s
user_class      = xNBA
user_class_form = raw
assert =
    msgtype  == OFFER
    yiaddr   == %(xnba_ip)s
    bootfile == %(xnba_stage2)s

[scenario netboot-xnba-second-stage-rfc3004]
description = S-25: The same request, length-prefixed per RFC 3004, is recognised too

[step xnba-stage2-rfc]
type            = discover
mac             = %(xnba_mac)s
user_class      = xNBA
user_class_form = rfc3004
assert =
    msgtype  == OFFER
    bootfile == %(xnba_stage2)s

[scenario node-learns-its-name]
description = S-35: The node is told its own name in option 12

# Genesis and every installer that takes its hostname from the lease read this
# option. A reply that carries the address but not the name leaves the machine
# to guess, and it guesses wrong.
[step host-name-discover]
type = discover
mac  = %(xnba_mac)s
assert =
    msgtype   == OFFER
    option:12 matches ^%(xnba_node)s(\.|$)

# The label is what is asserted, not the whole string: a server that qualifies
# the name with the cluster domain has still told the node who it is. Kea 2.4.1
# appends ddns-qualifying-suffix to a reservation name; ISC sends the option
# verbatim.

[scenario node-keeps-its-name]
description = S-35: A node advertising another name is still told its own

# Every real client sends option 12: dhclient sends the name it already has,
# and the Ubuntu installer sends the one the live image booted with. A server
# that takes the client at its word answers with that name, and -- S-74, which
# this step cannot see -- writes it into the lease and into the DNS record for
# the node's address.

[step host-name-claimed]
type     = discover
mac      = %(xnba_mac)s
hostname = notthisnode
assert =
    msgtype  == OFFER
    dns_name matches ^%(xnba_node)s(\.|$)

[scenario node-keeps-its-name-in-fqdn]
description = S-75: A node claiming a name in option 81 is still told its own

# Option 81 is the other half of the same request and a different code path in
# both servers: a client that sends it is asking to be named, and asking about
# who updates DNS. dns_name is asserted rather than option 81 itself, because
# the two servers answer in different options -- Kea in 81, ISC in 12 -- and
# the node reads whichever arrived.

[step fqdn-claimed]
type   = discover
mac    = %(xnba_mac)s
fqdn   = notthisnode
assert =
    msgtype  == OFFER
    dns_name matches ^%(xnba_node)s(\.|$)

[scenario netboot-pxe]
description = S-27: A node with netboot=pxe is handed pxelinux

[step pxe-discover]
type = discover
mac  = %(pxe_mac)s
assert =
    msgtype  == OFFER
    yiaddr   == %(pxe_ip)s
    bootfile == %(pxe_loader)s

[scenario netboot-pxe-scalemp]
description = S-30: The same node announcing ScaleMP is handed the vSMP loader

# vSMP boots an aggregated machine out of several boards. It is a different
# binary from pxelinux.0, and the vendor class is the only thing that says the
# client wants it.
[step scalemp-discover]
type         = discover
mac          = %(pxe_mac)s
vendor_class = ScaleMP
assert =
    msgtype  == OFFER
    bootfile == %(scalemp_loader)s

[scenario netboot-grub2]
description = S-27: A node with netboot=grub2 is handed its own grub2

[step grub2-discover]
type = discover
mac  = %(grub2_mac)s
assert =
    msgtype  == OFFER
    yiaddr   == %(grub2_ip)s
    bootfile == %(grub2_loader)s

[scenario netboot-yaboot]
description = S-27: A node with netboot=yaboot is handed its own yaboot

[step yaboot-discover]
type = discover
mac  = %(yaboot_mac)s
assert =
    msgtype  == OFFER
    bootfile == %(yaboot_loader)s

[scenario netboot-nimol]
description = S-27: A node with netboot=nimol is handed its VIOS boot path

[step nimol-discover]
type = discover
mac  = %(nimol_mac)s
assert =
    msgtype  == OFFER
    bootfile == %(nimol_loader)s

[scenario netboot-petitboot]
description = S-28: A node with netboot=petitboot is given a conf-file and no boot file

# petitboot reads the conf-file and decides for itself; a filename in the same
# reply starts a TFTP fetch nobody asked for.
#
# 0x000e, OPAL-v3, is what a petitboot machine actually announces, and the
# subnet hands an OPAL client no loader either -- so an empty boot file here is
# the node's own answer, not an accident of the client architecture.
[step petitboot-discover]
type        = discover
mac         = %(petitboot_mac)s
client_arch = 0x000e
assert =
    msgtype    == OFFER
    option:209 == %(petitboot_conf)s
    bootfile   absent

[scenario noip-interface-is-denied]
description = S-07: An interface marked *NOIP* is not answered at all

# The operator marked this MAC so nothing boots on it -- a second port on a
# machine that provisions through the first. A subnet-wide boot class that still
# matches the frame defeats the marking.
[step noip-discover]
type    = discover
mac     = %(noip_mac)s
expect  = none
timeout = 2
retries = 2
