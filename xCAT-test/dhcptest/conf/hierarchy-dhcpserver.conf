# A network whose dynamic pool is served by some other machine.
#
# In a hierarchical cluster the management node hands a subnet's pool over to
# another server and keeps only the reservations it still answers for. Two things
# become observable, neither visible in the other server's configuration:
#
#   this server no longer answers an unknown MAC at all -- the pool is not its
#   to give out
#
#   a machine it does answer for is pointed at a next-server that is not this
#   server, so the machine loads its boot file from the delegate
#
# Run against the machine that gave the pool away, not the one that took it;
# against the delegate, run provision-vs-discovery.conf instead.
#
#   dhcptest run -i eth1 \
#       --set node_mac=52:54:00:aa:bb:01 \
#       --set node_ip=10.0.0.11 \
#       --set node_loader=/boot/grub2/grub2-cn1 \
#       --set delegate=10.0.0.5 \
#       --set unknown_mac=02:00:de:ad:be:ef \
#       conf/hierarchy-dhcpserver.conf

[scenario delegated-pool-is-not-served-here]
description = S-40: An unknown MAC gets nothing: the dynamic pool belongs to another server

[step delegated-discover]
type    = discover
mac     = %(unknown_mac)s
expect  = none
timeout = 5
retries = 1
assert =
    offers == 0

[scenario delegated-node-is-pointed-elsewhere]
description = S-41: A known machine is still answered, but sent to the delegate to boot

[step delegated-node-discover]
type            = discover
mac             = %(node_mac)s
client_arch     = 0x0000
vendor_class    = PXEClient:Arch:00000:UNDI:002001
request_options = 1, 3, 6, 54, 66, 67
expect          = offer
assert =
    msgtype  == OFFER
    yiaddr   == %(node_ip)s
    siaddr   == %(delegate)s
    bootfile == %(node_loader)s
