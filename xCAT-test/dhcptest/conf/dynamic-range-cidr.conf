# The dynamic range written as a CIDR block rather than as a pair.
#
# networks.dynamicrange accepts "10.0.0.200-10.0.0.250" and "10.0.0.192/26"
# alike, and several ranges separated by ";". A backend that parses only the
# first form serves nothing at all on a cluster that used the second, which is
# a discovery that silently never starts.
#
# This asserts the same thing static-vs-dynamic.conf does, against a network
# whose range was rewritten in the other notation.
#
# Scenario names carry the review number of the specification scenario they
# assert -- see xCAT-test/dhcptest/spec.md.
#
#   dhcptest run -i eth1 --set unknown_mac=02:00:de:ad:be:ef \
#       --set pool=10.0.0.192/26 conf/dynamic-range-cidr.conf

[scenario cidr-range-is-served]
description = S-05: A range written in CIDR notation is offered from just the same

[step cidr-discover]
type            = discover
mac             = %(unknown_mac)s
request_options = 1, 3, 6, 54
expect          = offer
timeout         = 3
retries         = 3
assert =
    msgtype == OFFER
    yiaddr  in %(pool)s

[step cidr-request]
type              = request
requested_address = $offer.address
server_id         = $offer.server_id
expect            = ack
assert =
    msgtype == ACK
    yiaddr  in %(pool)s
