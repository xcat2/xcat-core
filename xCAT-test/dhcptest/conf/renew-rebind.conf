# Take a lease, renew it against the server that granted it, then rebind by
# broadcast.
#
# The leased address is never configured on this host. The renewal is sent from
# it at Layer 2, and the tool answers ARP for that address itself, only while
# the scenario is running and only for addresses this session was granted.
#
#   dhcptest run -i eth1 --set net=10.0.0.0/24 conf/renew-rebind.conf

[scenario renew-and-rebind]
description = A granted lease can be renewed by unicast and rebound by broadcast

[step lease-discover]
type   = discover
expect = offer
assert =
    msgtype == OFFER

[step lease-request]
type              = request
requested_address = $offer.address
server_id         = $offer.server_id
expect            = ack
assert =
    msgtype == ACK
    yiaddr  == $offer.address

[step lease-renew]
type      = renew
ciaddr    = $lease.address
server_id = $lease.server_id
expect    = ack
assert =
    msgtype   == ACK
    yiaddr    == $lease.address
    option:51 present

[step lease-rebind]
type   = rebind
ciaddr = $lease.address
expect = ack
assert =
    msgtype == ACK
    yiaddr  == $lease.address
