# The full four-way handshake: the address that was offered is the address
# that gets acknowledged.
#
#   dhcptest run -i eth1 --set net=10.0.0.0/24 conf/full-lease.conf

[scenario full-lease]
description = DISCOVER/OFFER/REQUEST/ACK yields the offered address

[step discover]
type            = discover
request_options = 1, 3, 6, 51, 54
expect          = offer
assert =
    msgtype   == OFFER
    yiaddr    in %(net)s
    option:54 present

[step request]
type              = request
requested_address = $offer.address
server_id         = $offer.server_id
expect            = ack
assert =
    msgtype   == ACK
    yiaddr    == $offer.address
    option:54 == $offer.server_id
    option:51 present

[step check-lease]
type = noop
assert =
    $lease.address    in %(net)s
    $lease.server_id  == $offer.server_id
