# An unknown machine is handed a loader as well as an address.
#
# This is server policy, not protocol, which is why it is a file of its own
# rather than a third scenario in provision-vs-discovery.conf: some servers
# put a boot file on the subnet, so anything that asks gets one and can be
# booted into a discovery image; others leave the boot file to the per-host
# blocks, so a machine they hold no reservation for gets an address and
# nothing else. Run this against the first kind only.
#
#   dhcptest run -i eth1 \
#       --set unknown_mac=02:00:de:ad:be:ef \
#       --set pool=10.0.0.200-10.0.0.250 \
#       --set discovery_loader=pxelinux.0 \
#       conf/discovery-bootfile.conf

[scenario unknown-node-is-told-what-to-boot]
description = A machine the server does not know is still handed a loader

[step discovery-boot-discover]
type            = discover
mac             = %(unknown_mac)s
client_arch     = 0x0000
vendor_class    = PXEClient:Arch:00000:UNDI:002001
request_options = 1, 3, 6, 43, 54, 60, 66, 67
expect          = offer
timeout         = 3
assert =
    msgtype  == OFFER
    yiaddr   in %(pool)s
    bootfile == %(discovery_loader)s
