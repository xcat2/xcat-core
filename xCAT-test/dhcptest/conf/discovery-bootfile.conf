# An unknown machine is handed a loader as well as an address.
#
# A machine being discovered has no reservation, so the answer can only come from
# the subnet -- and it has to come, or the machine never reaches the state where
# someone could define it. Both backends are required to answer it (spec S-56).
#
# A file of its own rather than a third scenario in provision-vs-discovery.conf
# only because it needs no node defined.
#
#   dhcptest run -i eth1 \
#       --set unknown_mac=02:00:de:ad:be:ef \
#       --set pool=10.0.0.200-10.0.0.250 \
#       --set discovery_loader=pxelinux.0 \
#       conf/discovery-bootfile.conf

[scenario unknown-node-is-told-what-to-boot]
description = S-55, S-56: A machine the server does not know is still handed a loader

[step discovery-boot-discover]
type            = discover
mac             = %(unknown_mac)s
client_arch     = 0x0000
vendor_class    = PXEClient:Arch:00000:UNDI:002001
request_options = 1, 3, 6, 43, 54, 60, 66, 67
expect          = offer
timeout         = 3
assert =
    msgtype  == OFFER
    yiaddr   in %(pool)s
    bootfile == %(discovery_loader)s
