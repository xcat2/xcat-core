# A machine with more than one provisioning interface.
#
# A node's mac attribute may list several addresses, each paired with the
# hostname that interface answers to: "mac1!host1|mac2!host2". Each is a separate
# reservation for a separate address, so the machine is reachable whichever port
# is cabled and comes up under the name belonging to that port.
#
# Reserving only the first MAC leaves a machine cabled on its second port
# unreachable; giving both the same address puts two interfaces on one address.
#
# Scenario names carry the review number of the spec scenario they assert.
#
#   dhcptest run -i eth1 \
#       --set first_mac=02:00:dc:11:00:41 --set first_ip=10.0.0.41 \
#       --set second_mac=02:00:dc:11:00:42 --set second_ip=10.0.0.42 \
#       conf/multi-mac-node.conf

[defaults]
client_arch     = 0x0000
vendor_class    = PXEClient:Arch:00000:UNDI:002001
request_options = 1, 3, 6, 12, 54
expect          = offer
timeout         = 3
retries         = 3

[scenario first-interface-is-reserved]
description = S-08: The first MAC in the list is offered its own hostname's address

[step first-mac-discover]
type = discover
mac  = %(first_mac)s
assert =
    msgtype == OFFER
    yiaddr  == %(first_ip)s

[scenario second-interface-is-reserved]
description = S-08: The second MAC is offered the address of the other hostname

[step second-mac-discover]
type = discover
mac  = %(second_mac)s
assert =
    msgtype == OFFER
    yiaddr  == %(second_ip)s
    yiaddr  != %(first_ip)s
