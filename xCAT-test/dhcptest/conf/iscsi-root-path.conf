# A node whose root filesystem is on an iSCSI target.
#
# With no local disk the address is not enough: the firmware also has to be told
# which target to open, and it reads that out of the same reply. Two forms of the
# same fact exist, and which one a machine reads depends on whose initiator it
# ships with.
#
# Scenario names carry the review number of the spec scenario they assert.
#
#   dhcptest run -i eth1 \
#       --set iscsi_mac=02:00:dc:11:00:51 --set iscsi_ip=10.0.0.51 \
#       --set root_path=iscsi:10.0.0.1:6:3260:0:iqn.2024-01.cluster:target0 \
#       conf/iscsi-root-path.conf

[defaults]
client_arch     = 0x0000
vendor_class    = PXEClient:Arch:00000:UNDI:002001
request_options = 1, 3, 6, 17, 43, 54, 60, 67, 203
expect          = offer
timeout         = 3
retries         = 3

[scenario iscsi-node-gets-a-root-path]
description = S-33: An iSCSI node is told its target in option 17

[step root-path-discover]
type = discover
mac  = %(iscsi_mac)s
assert =
    msgtype   == OFFER
    yiaddr    == %(iscsi_ip)s
    option:17 == %(root_path)s

[scenario isan-initiator-gets-the-vendor-form]
description = S-34: An ISAN initiator is told the same thing as vendor options instead

# IBM's initiator announces vendor class "ISAN" and does not read option 17 at
# all; it reads the vendor space carried in option 43. Sending it the standard
# option alone is a machine that gets an address and cannot find its own disk.
# The two forms are mutually exclusive on purpose.
[step isan-discover]
type         = discover
mac          = %(iscsi_mac)s
vendor_class = ISAN
assert =
    msgtype   == OFFER
    yiaddr    == %(iscsi_ip)s
    option:43 present
    option:17 absent
