# A machine that comes back asking for an address this network cannot give it.
#
# This is what a node does after it is moved between racks, or after a pool is
# renumbered: it still holds a lease and asks for that address again (INIT-REBOOT,
# a DHCPREQUEST carrying option 50 and no option 54).
#
# An authoritative server must answer DHCPNAK, so the machine gives up on the
# old address and starts over from DISCOVER. A server that stays silent leaves
# the machine retrying an address it will never get, which on a provisioning
# network looks exactly like a node that will not boot.
#
#   dhcptest run -i eth1 --set foreign_ip=192.0.2.77 conf/nak-foreign-address.conf

[scenario foreign-address-is-refused]
description = A request for an address off this network is refused, not ignored

[step reboot-request]
type              = request
requested_address = %(foreign_ip)s
expect            = nak
timeout           = 3
retries           = 2
assert =
    msgtype == NAK
