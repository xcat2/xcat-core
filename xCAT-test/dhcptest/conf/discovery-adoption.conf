# Adopting a machine that is already on the network.
#
# An unknown machine boots, takes a pool address, runs a discovery image and
# reports what it is. It is then defined as a node, and from that point must come
# up at its own address instead.
#
# The part worth asserting is that the change reaches the wire *while other
# machines are still being discovered*. A server that has to be restarted to pick
# up a reservation drops every machine part-way through, which is why xCAT
# injects ISC reservations over OMAPI rather than rewriting dhcpd.conf.
#
# The two scenarios run separately, against the same MAC, with the node defined
# in between:
#
#   dhcptest run -i eth1 -s machine-is-unknown \
#       --set adopt_mac=02:00:dc:11:00:aa --set pool=10.0.0.200-10.0.0.250 \
#       --set adopt_ip=10.0.0.12 conf/discovery-adoption.conf
#   ... define the node, run makedhcp for it, restart nothing ...
#   dhcptest run -i eth1 -s machine-has-been-adopted \
#       --set adopt_mac=02:00:dc:11:00:aa --set pool=10.0.0.200-10.0.0.250 \
#       --set adopt_ip=10.0.0.12 conf/discovery-adoption.conf

[defaults]
timeout = 3
retries = 3

[scenario machine-is-unknown]
description = S-58: Before it is defined, the machine is served out of the pool

[step before-discover]
type   = discover
mac    = %(adopt_mac)s
expect = offer
assert =
    msgtype == OFFER
    yiaddr  in %(pool)s
    yiaddr  != %(adopt_ip)s

[scenario machine-has-been-adopted]
description = S-58: Once it is defined, the same MAC is served its own address

[step after-discover]
type   = discover
mac    = %(adopt_mac)s
expect = offer
assert =
    msgtype == OFFER
    yiaddr  == %(adopt_ip)s
    yiaddr  not-in %(pool)s

[step after-request]
type              = request
mac               = %(adopt_mac)s
requested_address = $offer.address
server_id         = $offer.server_id
expect            = ack
assert =
    msgtype == ACK
    yiaddr  == %(adopt_ip)s
