# Silence is the expected result.
#
# This is the reservations-only policy: the subnet has no dynamic pool, or the
# pool is closed to clients the server holds no reservation for, so a MAC it
# has never been told about gets nothing at all.
#
# It is the opposite expectation to the second scenario in
# static-vs-dynamic.conf. Run the one that matches the network under test --
# running both against the same network will always fail one of them.
#
#   dhcptest run -i eth1 --set unreserved_mac=02:00:de:ad:be:ef conf/no-reply.conf

[scenario unreserved-mac-ignored]
description = A MAC with no reservation draws no reply at all

[step silent-discover]
type    = discover
mac     = %(unreserved_mac)s
expect  = none
timeout = 5
retries = 1
assert =
    offers == 0
