# The port in a URL the server hands out.
#
# xCAT's web server does not have to be on port 80, and when it is not every URL
# in the reply has to say so. A URL naming the default port on a cluster serving
# on another one is a fetch that is refused, at a stage where the machine cannot
# report why.
#
# Port 80 is left out of the URL entirely rather than written as ":80", so this
# is a real branch and not a formatting choice.
#
# Run with site.httpport set to something other than 80 and the configuration
# regenerated.
#
# Scenario names carry the review number of the spec scenario they assert.
#
#   dhcptest run -i eth1 --set tftp=10.0.0.1 --set httpport=8080 \
#       --set riscv64_loader=boot/grub2/grub2.riscv64 \
#       conf/http-port.conf

[defaults]
request_options = 1, 3, 6, 54, 60, 66, 67, 209, 239
expect          = offer
timeout         = 3
retries         = 3

[scenario http-boot-url-carries-the-port]
description = S-14: An HTTP-boot client's URL names the non-default web port

[step http-port-discover]
type         = discover
vendor_class = HTTPClient:Arch:00028:UNDI:003000
client_arch  = 0x001c
assert =
    msgtype   == OFFER
    option:60 == HTTPClient
    bootfile  starts-with http://%(tftp)s:%(httpport)s/
    bootfile  contains %(riscv64_loader)s
