# The two things a provisioning DHCP server has to keep apart: a machine it
# has been told about, and one it has not.
#
# A machine it knows must always get its own address, so the same host comes
# back at the same name every time it boots, and must be told to load the boot
# file that belongs to that host. A machine it does not know must get an
# address out of the dynamic pool instead -- that is what makes it reachable
# long enough to be identified and adopted.
#
# On the wire the two are told apart by the address alone: a reservation is by
# definition outside the pool.
#
# What an *unknown* machine is told to boot is asserted in
# discovery-bootfile.conf rather than here, so that this file needs only a
# defined node and that one needs only a pool. Both are required behaviour --
# see spec.md S-56 -- not alternatives to pick between.
#
# Nothing here says who configured the server, or with what. Every address and
# filename is supplied on the command line:
#
#   dhcptest run -i eth1 \
#       --set node_mac=52:54:00:aa:bb:01 \
#       --set node_ip=10.0.0.11 \
#       --set node_loader=/boot/grub2/grub2-cn1 \
#       --set pool=10.0.0.200-10.0.0.250 \
#       --set next_server=10.0.0.1 --set server=10.0.0.1 \
#       --set unknown_mac=02:00:de:ad:be:ef \
#       --set gateway=10.0.0.1 --set nameservers=10.0.0.1 \
#       --set domain=cluster --set mtu=1500 --set lease=43200 \
#       --set cumulus_url=http://10.0.0.1/install/postscripts/cumulusztp \
#       conf/provision-vs-discovery.conf

[defaults]
client_arch     = 0x0000
vendor_class    = PXEClient:Arch:00000:UNDI:002001
request_options = 1, 3, 6, 7, 15, 26, 42, 43, 51, 54, 60, 66, 67, 119, 239
timeout         = 3
retries         = 3

[scenario known-node-is-provisioned]
description = A machine the server knows gets its own address and its own boot file

[step known-discover]
type   = discover
mac    = %(node_mac)s
expect = offer
assert =
    msgtype  == OFFER
    yiaddr   == %(node_ip)s
    yiaddr   not-in %(pool)s
    siaddr   == %(next_server)s
    bootfile == %(node_loader)s

[step known-request]
type              = request
mac               = %(node_mac)s
requested_address = $offer.address
server_id         = $offer.server_id
expect            = ack
assert =
    msgtype  == ACK
    yiaddr   == %(node_ip)s
    siaddr   == %(next_server)s
    bootfile == %(node_loader)s
    option:1 present

[scenario known-node-gets-a-usable-network]
description = The node is told how to route, resolve and keep time, not just its address

# An address on its own does not install an operating system. The installer has
# to route off the provisioning network, resolve the server it fetches from,
# and agree with the rest of the cluster about the time; a discovery image has
# to have somewhere to log to. Each of those is one option in this reply, and a
# server that hands out addresses and nothing else fails much later and much
# less obviously.
#
# Options 7 (S-48) and 42 (S-47) are asserted to be the management node's own
# address rather than merely present: both default to it when the cluster
# configured neither, and "present" would pass on a reply that named some
# unreachable host left over from another network. Option 239 (S-52) is the
# Cumulus provisioning URL, pushed on every subnet unconditionally, and 119
# (S-46) is the search list the installer resolves short names against.
#
# Asked for as an INIT-REBOOT request -- option 50, no option 54 -- which is
# what a node that already holds this lease sends when it comes back up.
[step known-network-settings]
type              = request
mac               = %(node_mac)s
requested_address = %(node_ip)s
expect            = ack
assert =
    msgtype    == ACK
    option:3   == %(gateway)s
    option:6   == %(nameservers)s
    option:15  == %(domain)s
    option:119 contains %(domain)s
    option:7   == %(server)s
    option:42  == %(server)s
    option:26  == %(mtu)s
    option:51  == %(lease)s
    option:239 == %(cumulus_url)s

[scenario node-comes-back-to-the-same-address]
description = S-02: A node that takes its lease, gives it back and reboots gets the same address

# The whole deployment is built on the node's name meaning one address:
# /etc/hosts, DNS, the kickstart URL the installer fetches. A reservation that
# drifted between boots would break all of them, and would break them silently,
# because each individual boot succeeds.
#
# The lease is taken and released rather than merely asked for twice, so that
# the server has had every opportunity to hand the address to somebody else in
# between. Asserting against the first reply as well as against the expected
# address is what makes this a statement about stability and not a second copy
# of the scenario above.
[step first-boot-discover]
type   = discover
mac    = %(node_mac)s
expect = offer
assert =
    msgtype == OFFER
    yiaddr  == %(node_ip)s

[step first-boot-request]
type              = request
requested_address = $offer.address
server_id         = $offer.server_id
expect            = ack
assert =
    msgtype == ACK
    yiaddr  == %(node_ip)s

[step shut-down]
type = release

[step reboot-discover]
type   = discover
mac    = %(node_mac)s
expect = offer
assert =
    msgtype == OFFER
    yiaddr  == $first-boot-discover.yiaddr
    yiaddr  == %(node_ip)s

[scenario unknown-node-is-discovered]
description = A machine the server does not know gets an address out of the pool

[step unknown-discover]
type   = discover
mac    = %(unknown_mac)s
expect = offer
assert =
    msgtype == OFFER
    yiaddr  in %(pool)s
    yiaddr  != %(node_ip)s
    siaddr  == %(next_server)s

[step unknown-request]
type              = request
mac               = %(unknown_mac)s
requested_address = $offer.address
server_id         = $offer.server_id
expect            = ack
assert =
    msgtype == ACK
    yiaddr  == $offer.address
    yiaddr  in %(pool)s
