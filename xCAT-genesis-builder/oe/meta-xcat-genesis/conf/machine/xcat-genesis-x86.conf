#@TYPE: Machine
#@NAME: xCAT Genesis x86
#@DESCRIPTION: i686 32-bit Genesis target

DEFAULTTUNE = "i686"
XCAT_GENESIS_ARCHITECTURE = "x86"
require conf/machine/include/x86/tune-i686.inc
require conf/machine/include/qemu.inc
require conf/machine/include/x86/qemuboot-x86.inc

KERNEL_IMAGETYPE = "bzImage"
SERIAL_CONSOLES = "115200;ttyS0"
XCAT_GENESIS_CONSOLE_TTY = "ttyS0"

MACHINE_FEATURES_DEFAULTS = ""
MACHINE_FEATURES = "pci"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = ""
MACHINE_EXTRA_RRECOMMENDS = ""

IMAGE_FSTYPES = "cpio.gz ext4"

QB_SYSTEM_NAME = "qemu-system-i386"
QB_DEFAULT_FSTYPE = "ext4"
QB_KERNEL_CMDLINE_APPEND = "console=ttyS0"
