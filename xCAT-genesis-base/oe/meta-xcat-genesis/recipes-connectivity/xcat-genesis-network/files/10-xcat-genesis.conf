[main]
dhcp=internal
dns=default
plugins=keyfile
rc-manager=symlink

[connection]
ipv4.dhcp-timeout=20
# A node with no SMBIOS UUID gets a hw-address reservation, and Kea reads the hardware
# address out of a DUID-LL. genesis-duid overrides this from 15-xcat-genesis-duid.conf when
# the node does have an SMBIOS UUID, because then the reservation holds a DUID-UUID.
ipv6.dhcp-duid=ll
ipv6.dhcp-timeout=20
