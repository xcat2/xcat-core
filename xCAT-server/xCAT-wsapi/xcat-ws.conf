# The Apache configuration for the xCAT REST API, for every RPM family.
#
# Do not add a LoadModule: it names one distribution's module directory and is
# then absent on the others, which stops Apache from starting.

# Redirect http to https. Guarded because mod_rewrite can be absent.
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteCond %{SERVER_PORT} 80
RewriteCond %{HTTPS} !=on
RewriteRule ^/?xcatws/(.*) https://%{SERVER_NAME}/xcatws/$1 [R,L]
RewriteRule ^/?xcatwsv2/(.*) https://%{SERVER_NAME}/xcatwsv2/$1 [R,L]
</IfModule>
# Without the redirect, deny the REST aliases.
<IfModule !mod_rewrite.c>
RedirectMatch 403 ^/xcatws(v2)?(/|$)
</IfModule>

<FilesMatch "^(xcatws.cgi|zvmxcatws.cgi)$">
# Both spellings, so one file serves Apache 2.2 and 2.4.
<IfModule mod_authz_core.c>
Require all granted
</IfModule>
<IfModule !mod_authz_core.c>
Order allow,deny
Allow from all
</IfModule>
</FilesMatch>
